#define PI 3.1415

int m = 0;

mat2 rot(float a) { float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }
mat3 lookAt(vec3 dir) {
    vec3 up=vec3(0.,1.,0.);
    vec3 rt=normalize(cross(dir,up));
    return mat3(rt, cross(rt,dir), dir);
}

float gyroid(vec3 p) { return dot(cos(p), sin(p.zxy)) + 1.; }

float map(vec3 p) {
    float r = 1e5, d;
    
    d = gyroid(p);
    if (d<r) { r=d; m=1; }
    
    d = gyroid(p - vec3(0,0,PI));
    if (d<r) { r=d; m=2; }
    
    return r;
}

float raymarch(vec3 ro, vec3 rd) {
    float t = 0.;
    for (int i=0; i<150; i++) {
        float d = map(ro + rd*t);
        if (abs(d) < .001) break;
        t += d;
        if (t > FAR) break;
    }
    return t;
}

float getAO(vec3 p, vec3 sn){
	float occ = 0.;
    for (float i=0.; i<4.; i++) {
        float t = i*.08;        
        float d = map(p + sn*t);
        occ += t-d;
    }
    return clamp(1.-occ, 0., 1.);    
}

vec3 getNormal(vec3 p){
    vec2 e = vec2(0.5773,-0.5773)*0.001;
    return normalize(e.xyy*map(p+e.xyy) + e.yyx*map(p+e.yyx) + e.yxy*map(p+e.yxy) + e.xxx*map(p+e.xxx));
}

vec3 trace(vec3 ro, vec3 rd) {   
    vec3 C = vec3(0);
    vec3 throughput = vec3(1);
    
    for (int bounce = 0; bounce < 2; bounce++) {
        float d = raymarch(ro, rd);
        if (d > FAR) { break; }

        // fog
        float fog = 1. - exp(-.008*d*d);
        C += throughput * fog * vec3(0); throughput *= 1. - fog;        
        
        vec3 p = ro + rd*d;
        vec3 sn = normalize(getNormal(p) + pow(abs(cos(p*64.)), vec3(16))*.1);

        // lighting
        vec3 lp = vec3(10.,-10.,-10.+ro.z) ;
        vec3 ld = normalize(lp - p);
        float diff = max(0., .5+2.*dot(sn, ld));
        float diff2 = pow(length(sin(sn*2.)*.5+.5), 2.);
        float diff3 = max(0., .5+.5*dot(sn, vec2(1,0).yyx));
        
        float spec = max(0., dot(reflect(-ld, sn), -rd));
        float fres = 1. - max(0.,dot(-rd, sn));
        vec3 col = vec3(0), alb = vec3(0);
        
        col += ( iColorPrimary.xyz )  * diff; // vec3(.4, .6, .9)
        col += ( iColorPrimary.xyz )  * diff2; // vec3(.5, .1, .1)
        col += ( iColorPrimary.xyz )  * diff3; // vec3(.9, .1, .4)
        col += ( iColorPrimary.xyz )  * pow(spec,4.)*8.; // vec3(.3,.25,.25)
        
        float freck = dot(cos(p*23.),vec3(1));
        if (m==1) { alb = vec3(.2, .1, .9);  alb *= max(.6, step(2.5, freck)); }
        if (m==2) { alb = vec3(.6, .3, .1);  alb *= max(.8, step(-2.5, freck)); }
        col *= alb;
        
        col *= getAO(p, sn);
        C += throughput * col;
            
        // reflection
        rd = reflect(rd, sn);
        ro = p + sn*.01;
        throughput *=  .9 * pow(fres, 1.);

    }
    return C;
}

void mainImage( out vec4 fragColor, in vec2 fragCoord ) {
    vec2 uv = (fragCoord.xy - iResolution.xy*.5) / iResolution.y;
    vec2 mo = (iMouse.xy - iResolution.xy*.5) / iResolution.y;

    vec3 ro = vec3(PI/2.,0, -iTime*.5);
    vec3 rd = normalize(vec3(uv, -.5));

    if (iMouse.z > 0.) {
        rd.zy = rot(mo.y*PI) * rd.zy;
        rd.xz = rot(-mo.x*PI) * rd.xz;
    } else {
        rd.xy = rot(sin(iTime*.2)) * rd.xy;
        vec3 ta = vec3(cos(iTime*.4), sin(iTime*.4), 4.);
        rd = lookAt(normalize(ta)) * rd;
    }
    
    vec3 col = trace(ro, rd);
    
    col *= smoothstep(0.,1., 1.2-length(uv*.9));
    col = pow(col, vec3(0.4545));
    fragColor = vec4(col, 1.0);
} `;

        setFailed() {

            this.elButtonPlay = document.querySelector('button[aria-label="play"]');

            this.elButtonReset = document.querySelector('button[aria-label="reset"]');

            this.startTime = Date.now();
            this.lastNow = Date.now(); 
            this.lastFrameTime = Date.now(); 
            
            this.iTime              = 0; 
            this.iResolution        = [0, 0]; 
            this.iMouse             = [0, 0, 0, 0]; 
            this.iColorDark         = [0, 0, 0, 0];
            this.iColorPrimary      = [0, 0, 0, 0];
            this.iColorPrimaryDark  = [0, 0, 0, 0];
            this.iColorPrimaryLight = [0, 0, 0, 0];
            this.iAA                = 1; 

            this.frameCount = 0; 
            this.fps = 0; 

            this.uniforms = [];

            this.scaleFactor = 1.0; 
            this.maxTime = 0;
            
            this.initShader(fragmentShader);
            this.resize();
            
            this.canvas.addEventListener('resize', () => this.resize());

            this.elButtonPause.classList.toggle("active", false); 
            this.elButtonPlay.classList.toggle("active", true); 

            this.elButtonPause.addEventListener('click', () => { 
                this.elButtonPause.classList.toggle("active", true); 
                this.elButtonPlay.classList.toggle("active", false); 
                this.isPaused = true;

                
            });

            this.elButtonPlay.addEventListener('click', () => { 
                this.elButtonPause.classList.toggle("active", false); 
                this.elButtonPlay.classList.toggle("active", true); 
                this.isPaused = false;
                this.elTimeRange.max = Math.ceil(this.maxTime * 100) / 100;

                this.elTimeRange.value = this.maxTime;  

                this.lastNow = Date.now(); 
            });

            this.elButtonReset.addEventListener('click', () => { 
                
                this.lastNow = Date.now(); 
                this.iTime = 0; 
                this.maxTime = 0; 
                this.elTimeRange.value = 0; 
                this.elTimeRange.max = 0;

            //             console.error(`Error attempting to enable fullscreen: ${err.message}`);
            //         });

            //         this.resize(); // Resize back to normal
            //     }
            // });

            // 
            // capture buttons
            // 

            const captureButtons = document.querySelectorAll("button.capture"); 
            captureButtons.forEach( el => { 
                let w = 0; 
                let h = 0; 

                switch (el.getAttribute("data-capture")) { 
                    case "fullscreen": 
                        w = window.screen.width * window.devicePixelRatio;
                        h = window.screen.height * window.devicePixelRatio;
                    break; 

                    case "canvas": 
                        w = this.canvas.width;
                        h = this.canvas.height; 
                        break;

                    case "custom": 
                        w = parseInt(el.getAttribute("data-capture-width")); 
                        h = parseInt(el.getAttribute("data-capture-height")); 
                        break; 

                    default:
                        console.log("bad screenshot button"); 
                        return; 
                }

                el.addEventListener('click', () => { 
                    requestAnimationFrame(() => {
                        this.captureResolution(w, h);
                    });
                });
            }); 

            //
            // downres buttons 
            // 

            const downresButtons = document.querySelectorAll("button.downres"); 
            downresButtons.forEach( el => { 
                
                
                el.addEventListener("click", () => {

                    downresButtons.forEach( el2 => el2.classList.toggle("active", false)); 
                    el.classList.toggle("active", true);

            //

                    iaaButtons.forEach( el2 => el2.classList.toggle("active", false)); 
                    el.classList.toggle("active", true);  
                });
            });

            //

            // 

            this.elTimeRange.addEventListener("input", () => { 
                if (this.isPaused == false) { 
                    this.elTimeRange.max = Math.ceil(this.maxTime * 100) / 100;

                    this.elTimeRange.value = this.maxTime;
                }
                this.elButtonPause.classList.toggle("active", true); 
                this.elButtonPlay.classList.toggle("active", false); 
                this.isPaused = true; 
            
                this.iTime = parseFloat(this.elTimeRange.value);

        setScalingFactor(scaleFactor) {  
            this.scaleFactor = Math.min(Math.max(scaleFactor, 0.1), 1.0);
            this.resize(); 
            console.log(`scaling factor set: ${this.scaleFactor}`); 
        }

        setIAAValue(iAAValue) { 
            this.iAA = Math.min(Math.max(iAAValue, 1), 100);
            console.log(`iaa value set: ${this.iAA}`);
        }

        captureResolution(width, height) {
            const gl = this.gl;
            
            // 1. Store original state
            const originalW = this.canvas.width;
            const originalH = this.canvas.height;
            const originalRes = [...this.iResolution];

            // 2. Resize buffer for the high-res shot
            this.canvas.width = width;
            this.canvas.height = height;
            this.iResolution[0] = width;
            this.iResolution[1] = height;
            gl.viewport(0, 0, width, height);

            // 3. Render a single frame with updated uniforms
            this.uniforms.forEach(e => e.submit(e.loc)); 
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

            // 4. Capture the pixels
            this.canvas.toBlob((blob) => {
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.download = `wallpaper-${width}x${height}.png`;
                link.href = url;
                link.click();
                URL.revokeObjectURL(url);

                // 5. Restore original state after the browser processes the blob
                this.canvas.width = originalW;
                this.canvas.height = originalH;
                this.iResolution = originalRes;
                gl.viewport(0, 0, originalW, originalH);
                // Trigger one normal render to clean up the visual state for the user
                this.render(); 
            }, 'image/png');
        }
    
        initShader(fragmentSource) {
            const gl = this.gl;
            
            const vertexSource = `#version 300 es
                in vec2 position;

                void main() {
                    gl_Position = vec4(position, 0.0, 1.0);
                }
            `;

            const fragmentSourcePrefix = `#version 300 es
                precision highp float;

                uniform float   iTime;
                uniform vec2    iResolution;
                uniform vec4    iMouse;

                uniform vec4    iColorLighter;
                uniform vec4    iColorLight;
                uniform vec4    iColorGray;
                uniform vec4    iColorDark;
                uniform vec4    iColorDarker;

                uniform vec4    iColorPrimary;
                uniform vec4    iColorPrimaryDark; 
                uniform vec4    iColorPrimaryLight; 
                uniform int     iAA; 
            `; 

            const fragmentSourceSuffix = `

                out vec4 _lzon_frag_color;
                void main() {
                    int _iAA = iAA; 
                    vec4 _color = vec4(0.0);
                    for (int x = 0; x < _iAA; x++) {
                        for (int y = 0; y < _iAA; y++) {
                            vec2 _offset = (vec2(float(x), float(y)) + 0.5) / float(_iAA) - 0.5;
                            vec4 _sample;
                            mainImage(_sample, gl_FragCoord.xy + _offset);
                            _color += _sample;
                        }
                    }
                    _lzon_frag_color = _color / float(_iAA * _iAA);
                } 

            `; 
            
            const vertexShader = gl.createShader(gl.VERTEX_SHADER);
            gl.shaderSource(vertexShader, vertexSource);
            gl.compileShader(vertexShader);
            
            const fragmentShader = gl.createShader(gl.FRAGMENT_SHADER);
            gl.shaderSource(fragmentShader, fragmentSourcePrefix + fragmentSource + fragmentSourceSuffix);
            gl.compileShader(fragmentShader);
            
            if (!gl.getShaderParameter(fragmentShader, gl.COMPILE_STATUS)) {
                console.error('Fragment shader error:', gl.getShaderInfoLog(fragmentShader));
                this.setFailed(); 
                return;
            }
            
            this.program = gl.createProgram();
            gl.attachShader(this.program, vertexShader);
            gl.attachShader(this.program, fragmentShader);
            gl.linkProgram(this.program);
            gl.useProgram(this.program);
            
            const vertices = new Float32Array([-1,-1, 1,-1, -1,1, 1,1]);
            const buffer = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
            gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);
            
            const posLoc = gl.getAttribLocation(this.program, 'position');
            gl.enableVertexAttribArray(posLoc);
            gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

            this.uniforms.push({ name:"iTime"               , submit: (loc) => { gl.uniform1f(loc,    this.iTime);              }});
            this.uniforms.push({ name:"iResolution"         , submit: (loc) => { gl.uniform2f(loc, ...this.iResolution);        }});
            this.uniforms.push({ name:"iMouse"              , submit: (loc) => { gl.uniform4f(loc, ...this.iMouse);             }});
            
            this.uniforms.push({ name:"iColorDarker"    , submit: (loc) => { gl.uniform4f(loc, ...this.iColorDarker);         }});
            this.uniforms.push({ name:"iColorDark"      , submit: (loc) => { gl.uniform4f(loc, ...this.iColorDark);         }});
            this.uniforms.push({ name:"iColorGray"      , submit: (loc) => { gl.uniform4f(loc, ...this.iColorGray);         }});
            this.uniforms.push({ name:"iColorLight"     , submit: (loc) => { gl.uniform4f(loc, ...this.iColorLight);         }});
            this.uniforms.push({ name:"iColorLighter"   , submit: (loc) => { gl.uniform4f(loc, ...this.iColorLighter);         }});

            this.uniforms.push({ name:"iColorPrimary"       , submit: (loc) => { gl.uniform4f(loc, ...this.iColorPrimary);      }});
            this.uniforms.push({ name:"iColorPrimaryDark"   , submit: (loc) => { gl.uniform4f(loc, ...this.iColorPrimaryDark);  }});
            this.uniforms.push({ name:"iColorPrimaryLight"  , submit: (loc) => { gl.uniform4f(loc, ...this.iColorPrimaryLight); }});

            this.uniforms.push({ name:"iAA"                 , submit: (loc) => { gl.uniform1i(loc,    this.iAA);              }});

            this.uniforms.forEach(e => {  e.loc = gl.getUniformLocation(this.program, e.name); console.log(`${e.name} : ${e.loc} `); });
            

            this.canvas.addEventListener('mousemove', (e) => {
                const rect = this.canvas.getBoundingClientRect();
                this.iMouse[0] = e.offsetX;
                this.iMouse[1] = rect.height - (e.clientY - rect.top);
            });

            this.canvas.addEventListener('mousedown', (e) => {
                const rect = this.canvas.getBoundingClientRect();
                this.iMouse[2] = e.clientX - rect.left;
                this.iMouse[3] = rect.height - (e.clientY - rect.top);
            });



            this.iColorLighter = parseCSSColorToFloat('--color-lighter');
            this.iColorLight   = parseCSSColorToFloat('--color-light');
            this.iColorGray    = parseCSSColorToFloat('--color-gray');
            this.iColorDark    = parseCSSColorToFloat('--color-dark');
            this.iColorDarker  = parseCSSColorToFloat('--color-darker');
            
            this.iColorPrimary = parseCSSColorToFloat('--color-primary');
            this.iColorPrimaryDark = parseCSSColorToFloat('--color-primary-dark');
            this.iColorPrimaryLight = parseCSSColorToFloat('--color-primary-light');

            this.isPaused = false; 
        }
    
        resize() {
            const width  = Math.round(this.canvas.clientWidth  * this.scaleFactor);
            const height = Math.round(this.canvas.clientHeight * this.scaleFactor);

            this.iResolution[0] = width;
            this.iResolution[1] = height;

            this.canvas.width  = width;
            this.canvas.height = height;

            this.gl.viewport(0, 0, width, height);
            this.gl.texParameteri(this.gl.TEXTURE_2D, this.gl.TEXTURE_MAG_FILTER, this.gl.NEAREST);

            this.elResolution.innerText = `${width} x ${height}`;
        }



    
        render() {
            const gl = this.gl;
            const now = Date.now(); 
            const deltaTime = now - this.lastFrameTime;
            const totalTime = (now - this.startTime) / 1000;

            
            if (!this.isPaused) { 
                this.iTime = this.iTime + (now - this.lastNow) / 1000; 
                
                if (this.maxTime < this.iTime) this.maxTime = this.iTime;
            }
                
            this.lastNow = now; 



                

            this.uniforms.forEach( e => e.submit(e.loc) ); 
            
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
            requestAnimationFrame(() => this.render());

            // 
            // performance counters 
            // 

            this.frameCount ++; 

            
            if (deltaTime >= 1000) { 
                this.fps = (this.frameCount / deltaTime) * 1000; 
                this.frameCount = 0; 
                this.lastFrameTime = now; 
                this.elFramerate.innerText = `${this.fps.toFixed(1)} fps`; 
            }


            const totalTimeClamp = Math.min(999, this.iTime); 
            const maxTimeClamp = Math.min(999, this.maxTime);
            this.elTotaltime.innerText = `${totalTimeClamp.toFixed(1).padStart(5, '0')}`;
            this.elMaxtime.innerText = `${maxTimeClamp.toFixed(1).padStart(5, '0')}`;
        }
    }

    codeWrapper.innerHTML = HTML_GLSL_CODE + codeWrapper.innerHTML;

    sketch.render();
