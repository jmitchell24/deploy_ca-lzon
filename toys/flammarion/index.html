// Distance to a regular n-sided star.

// signed distance to a n-star polygon, with external angle w
float sdStar(in vec2 p, in float r, in float n, in float w)
{
    // these 5 lines can be precomputed for a given shape
    //float m = n*(1.0-w) + w*2.0;

            captureButtons.forEach( el => {

        playSketch() { 


            this.isPaused = false;

            this.elButtonsPause.forEach(el => el.classList.toggle("active", false)); 
            this.elButtonsPlay.forEach(el => el.classList.toggle("active", true)); 
            
            this.maxTime = Math.max(1.0, this.maxTime); 
            this.elTimeRange.forEach(el => { el.max = Math.ceil(this.maxTime * 100) / 100; el.value = this.maxTime; });

            this.lastNow = Date.now(); 

            if (!this._loopRunning) {
                requestAnimationFrame(() => this.render()); // jump-start render
            }
        }

        resetSketch() { 
            this.lastNow = Date.now(); 
            this.iTime = 0; 
            this.maxTime = 1; 
            this.elTimeRange.forEach(el => { el.value = 1; el.max = 1; });
        }

        setScalingFactor(scaleFactor) {  
            this.scaleFactor = Math.min(Math.max(scaleFactor, 0.1), 1.0);
            this.resize(); 
            console.log(`scaling factor set: ${this.scaleFactor}`); 
        }

        setIAAValue(iAAValue) {
            this.iAA = Math.min(Math.max(iAAValue, 1), 100);

            if (!this._loopRunning) requestAnimationFrame(() => this.render());
        }

        setTscaleValue(tscaleValue) { 
            this.iTimeScale = Math.min(Math.max(tscaleValue, 0.001), 100);

        }

        setFpslimit(fpslimitValue) { 
            this.fpsLimit = Math.min(Math.max(fpslimitValue, 0), 100);
            this.fpsInterval = this.fpsLimit > 0 ? 1000 / this.fpsLimit : 0;
            console.log(`fpslimit value set: ${this.fpsLimit}`);
        }

        //

        // new hotness
        async captureTiledAsync(cols, rows, tileSize = 4096) {
            const gl = this.gl;
            const totalW = cols * tileSize;
            const totalH = rows * tileSize;

            const CRC32_TABLE = (() => {
                const t = new Uint32Array(256);
                for (let i = 0; i < 256; i++) {
                    let c = i;
                    for (let j = 0; j < 8; j++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
                    t[i] = c;
                }
                return t;
            })();
            function crc32(data) {
                let c = 0xFFFFFFFF;
                for (let i = 0; i < data.length; i++) c = CRC32_TABLE[(c ^ data[i]) & 0xFF] ^ (c >>> 8);
                return (c ^ 0xFFFFFFFF) >>> 0;
            }
            function makeChunk(type, data) {
                const buf = new Uint8Array(4 + 4 + data.length + 4);
                const v = new DataView(buf.buffer);
                v.setUint32(0, data.length, false);
                for (let i = 0; i < 4; i++) buf[4 + i] = type.charCodeAt(i);
                buf.set(data, 8);
                v.setUint32(8 + data.length, crc32(buf.subarray(4, 8 + data.length)), false);
                return buf;
            }

            // Compression pipeline
            const cs = new CompressionStream('deflate');
            const csWriter = cs.writable.getWriter();

            // Collect compressed output concurrently
            const idatChunks = [];
            const collectDone = (async () => {
                const reader = cs.readable.getReader();
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    idatChunks.push(makeChunk('IDAT', value));
                }
            })();

            // Save state
            const origW = this.canvas.width, origH = this.canvas.height;
            const origRes = [...this.iResolution], origOffset = [...this.iTileOffset];
            this.pauseSketch(); 

            try {
                this.iResolution = [totalW, totalH];

                for (let tileRow = 0; tileRow < rows; tileRow++) {
                    const tileBuffers = [];
                    for (let tileCol = 0; tileCol < cols; tileCol++) {
                        const x0 = tileCol * tileSize, y0 = tileRow * tileSize;
                        this.canvas.width = tileSize; this.canvas.height = tileSize;
                        gl.viewport(0, 0, tileSize, tileSize);
                        this.iTileOffset = [x0, totalH - y0 - tileSize];
                        this.uniforms.forEach(e => e.submit(e.loc));
                        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

                        const px = new Uint8Array(tileSize * tileSize * 4);
                        gl.readPixels(0, 0, tileSize, tileSize, gl.RGBA, gl.UNSIGNED_BYTE, px);

                        const flipped = new Uint8Array(tileSize * tileSize * 4);
                        for (let y = 0; y < tileSize; y++) {
                            const src = (tileSize - 1 - y) * tileSize * 4;
                            flipped.set(px.subarray(src, src + tileSize * 4), y * tileSize * 4);
                        }
                        tileBuffers.push(flipped);
                        await new Promise(r => setTimeout(r, 0));
                    }

                    for (let py = 0; py < tileSize; py++) {
                        const row = new Uint8Array(1 + totalW * 3); // RGB, no alpha
                        for (let tc = 0; tc < cols; tc++) {
                            for (let px = 0; px < tileSize; px++) {
                                const si = (py * tileSize + px) * 4;
                                const di = 1 + (tc * tileSize + px) * 3;
                                row[di]   = tileBuffers[tc][si];
                                row[di+1] = tileBuffers[tc][si+1];
                                row[di+2] = tileBuffers[tc][si+2];
                            }
                        }
                        await csWriter.write(row);
                    }
                }

                await csWriter.close();
                await collectDone;

                // Assemble PNG
                const ihdr = new Uint8Array(13);
                const iv = new DataView(ihdr.buffer);
                iv.setUint32(0, totalW, false); iv.setUint32(4, totalH, false);
                ihdr[8] = 8; ihdr[9] = 2; // 8-bit RGB

                const blob = new Blob([
                    new Uint8Array([137, 80, 78, 71, 13, 10, 26, 10]),
                    makeChunk('IHDR', ihdr),
                    ...idatChunks,
                    makeChunk('IEND', new Uint8Array(0)),
                ], { type: 'image/png' });

                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.download = `giga-${totalW}x${totalH}.png`;
                link.href = url;
                link.click();
                setTimeout(() => URL.revokeObjectURL(url), 10000);

            } finally {
                this.canvas.width = origW; this.canvas.height = origH;
                this.iResolution = origRes; this.iTileOffset = origOffset;
                gl.viewport(0, 0, origW, origH);
                this.renderOnce();
            }
        }

        captureResolution(width, height) {
            const gl = this.gl;
            
            // 1. Store original state
            const originalW = this.canvas.width;
            const originalH = this.canvas.height;
            const originalRes = [...this.iResolution];

            // 2. Resize buffer for the high-res shot
            this.canvas.width = width;
            this.canvas.height = height;
            this.iResolution[0] = width;
            this.iResolution[1] = height;
            gl.viewport(0, 0, width, height);

            // 3. Render a single frame with updated uniforms
            this.uniforms.forEach(e => e.submit(e.loc)); 
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

            // 4. Capture the pixels
            this.canvas.toBlob((blob) => {
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.download = `wallpaper-${width}x${height}.png`;
                link.href = url;
                link.click();
                URL.revokeObjectURL(url);

                // 5. Restore original state after the browser processes the blob
                this.canvas.width = originalW;
                this.canvas.height = originalH;
                this.iResolution = originalRes;
                gl.viewport(0, 0, originalW, originalH);
                // Trigger one normal render to clean up the visual state for the user
                this.render(); 
            }, 'image/png');
        }
    
        initShader(fragmentSource) {
            const gl = this.gl;
            
            const vertexSource = `#version 300 es
                in vec2 position;

                void main() {
                    gl_Position = vec4(position, 0.0, 1.0);
                }
            `;

            const fragmentSourcePrefix = `#version 300 es
                precision highp float;

                uniform float   iTime;
                uniform vec2    iResolution;
                uniform vec4    iMouse;

                uniform vec4    iColorLighter;
                uniform vec4    iColorLight;
                uniform vec4    iColorGray;
                uniform vec4    iColorDark;
                uniform vec4    iColorDarker;

                uniform vec4    iColorPrimary;
                uniform vec4    iColorPrimaryDark; 
                uniform vec4    iColorPrimaryLight; 
                uniform vec4    iColorSecondary;
                uniform vec4    iColorTertiary;

                uniform int     iAA; 

                uniform vec2    iTileOffset;
            `; 

            const fragmentSourceSuffix = `

                out vec4 _lzon_frag_color;
                void main() {
                    int _iAA = iAA; 
                    vec4 _color = vec4(0.0);
                    for (int x = 0; x < _iAA; x++) {
                        for (int y = 0; y < _iAA; y++) {
                            vec2 _offset = (vec2(float(x), float(y)) + 0.5) / float(_iAA) - 0.5;
                            vec4 _sample;
                            mainImage(_sample, gl_FragCoord.xy + _offset + iTileOffset);
                            _color += _sample;
                        }
                    }
                    _lzon_frag_color = _color / float(_iAA * _iAA);
                } 

            `; 
            
            const vertexShader = gl.createShader(gl.VERTEX_SHADER);
            gl.shaderSource(vertexShader, vertexSource);
            gl.compileShader(vertexShader);
            
            const fragmentShader = gl.createShader(gl.FRAGMENT_SHADER);
            gl.shaderSource(fragmentShader, fragmentSourcePrefix + fragmentSource + fragmentSourceSuffix);
            gl.compileShader(fragmentShader);
            
            if (!gl.getShaderParameter(fragmentShader, gl.COMPILE_STATUS)) {
                
                const errorString = gl.getShaderInfoLog(fragmentShader);
                console.error('Fragment shader error:', errorString);
                this.setFailed(errorString); 
                return;
            }
            
            this.program = gl.createProgram();
            gl.attachShader(this.program, vertexShader);
            gl.attachShader(this.program, fragmentShader);
            gl.linkProgram(this.program);
            gl.useProgram(this.program);
            
            const vertices = new Float32Array([-1,-1, 1,-1, -1,1, 1,1]);
            const buffer = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
            gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);
            
            const posLoc = gl.getAttribLocation(this.program, 'position');
            gl.enableVertexAttribArray(posLoc);
            gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

            this.uniforms.push({ name:"iTime"               , submit: (loc) => { gl.uniform1f(loc,    this.iTime);              }});
            this.uniforms.push({ name:"iResolution"         , submit: (loc) => { gl.uniform2f(loc, ...this.iResolution);        }});
            this.uniforms.push({ name:"iMouse"              , submit: (loc) => { gl.uniform4f(loc, ...this.iMouse);             }});
            this.uniforms.push({ name:"iTileOffset"         , submit: (loc) => { gl.uniform2f(loc, ...this.iTileOffset); }});
            
            this.uniforms.push({ name:"iColorDarker"    , submit: (loc) => { gl.uniform4f(loc, ...this.iColorDarker);         }});
            this.uniforms.push({ name:"iColorDark"      , submit: (loc) => { gl.uniform4f(loc, ...this.iColorDark);         }});
            this.uniforms.push({ name:"iColorGray"      , submit: (loc) => { gl.uniform4f(loc, ...this.iColorGray);         }});
            this.uniforms.push({ name:"iColorLight"     , submit: (loc) => { gl.uniform4f(loc, ...this.iColorLight);         }});
            this.uniforms.push({ name:"iColorLighter"   , submit: (loc) => { gl.uniform4f(loc, ...this.iColorLighter);         }});

            this.uniforms.push({ name:"iColorPrimary"       , submit: (loc) => { gl.uniform4f(loc, ...this.iColorPrimary);      }});
            this.uniforms.push({ name:"iColorPrimaryDark"   , submit: (loc) => { gl.uniform4f(loc, ...this.iColorPrimaryDark);  }});
            this.uniforms.push({ name:"iColorPrimaryLight"  , submit: (loc) => { gl.uniform4f(loc, ...this.iColorPrimaryLight); }});
            this.uniforms.push({ name:"iColorSecondary", submit: (loc) => { gl.uniform4f(loc, ...this.iColorSecondary); }});
            this.uniforms.push({ name:"iColorTertiary",  submit: (loc) => { gl.uniform4f(loc, ...this.iColorTertiary);  }});

            this.uniforms.push({ name:"iAA"                 , submit: (loc) => { gl.uniform1i(loc,    this.iAA);              }});

            this.uniforms.forEach(e => {  e.loc = gl.getUniformLocation(this.program, e.name); console.log(`${e.name} : ${e.loc} `); });
            

            this.canvas.addEventListener('mousemove', (e) => {
                const rect = this.canvas.getBoundingClientRect();
                this.iMouse[0] = e.offsetX;
                this.iMouse[1] = rect.height - (e.clientY - rect.top);
            });

            this.canvas.addEventListener('mousedown', (e) => {
                const rect = this.canvas.getBoundingClientRect();
                this.iMouse[2] = e.clientX - rect.left;
                this.iMouse[3] = rect.height - (e.clientY - rect.top);
            });



            this.iColorLighter = parseCSSColorToFloat('--color-lighter');
            this.iColorLight   = parseCSSColorToFloat('--color-light');
            this.iColorGray    = parseCSSColorToFloat('--color-gray');
            this.iColorDark    = parseCSSColorToFloat('--color-dark');
            this.iColorDarker  = parseCSSColorToFloat('--color-darker');
            
            this.iColorPrimary = parseCSSColorToFloat('--color-primary');
            this.iColorSecondary = parseCSSColorToFloat('--color-secondary');
            this.iColorTertiary  = parseCSSColorToFloat('--color-tertiary');

            this.iColorPrimaryDark = parseCSSColorToFloat('--color-primary-dark');
            this.iColorPrimaryLight = parseCSSColorToFloat('--color-primary-light');

            this.isPaused = false; 
        }
    
        resize() {
            // Multiply by devicePixelRatio so the canvas buffer matches physical pixels
            // on high-DPI displays (e.g. DPR=3 on mobile). Without this, the buffer is
            // 1/DPR of the display resolution and renders blurry/small.
            const dpr    = window.devicePixelRatio || 1;
            const width  = Math.round(this.canvas.clientWidth  * this.scaleFactor * dpr);
            const height = Math.round(this.canvas.clientHeight * this.scaleFactor * dpr);

            this.iResolution[0] = width;
            this.iResolution[1] = height;

            this.canvas.width  = width;
            this.canvas.height = height;

            this.gl.viewport(0, 0, width, height);
            this.gl.texParameteri(this.gl.TEXTURE_2D, this.gl.TEXTURE_MAG_FILTER, this.gl.NEAREST);

            this.elResolution.forEach(el => el.innerText = `${width} x ${height}`);

            if (!this._loopRunning) requestAnimationFrame(() => this.render());
        }

        renderOnce() {
            const gl = this.gl;
            this.lastNow = Date.now();
            this.uniforms.forEach(e => e.submit(e.loc));
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        }

        render() {
            this._loopRunning = true;

            const gl = this.gl;
            const now = Date.now();

            if (this.fpsInterval > 0) {
                const elapsed = now - this.lastRenderTime;
                if (elapsed < this.fpsInterval) {
                    if (this.isPaused) { this._loopRunning = false; return; }
                    setTimeout(() => requestAnimationFrame(() => this.render()),
                            this.fpsInterval - elapsed);
                    return;
                }
                this.lastRenderTime = now - (elapsed % this.fpsInterval);
            }

            const deltaTime = now - this.lastFrameTime;

            if (!this.isPaused) {
                const newTime = (now - this.lastNow) / 1000;
                this.iTime += newTime * this.iTimeScale;

                if (this.maxTime < this.iTime) this.maxTime = this.iTime;

                const maxVal = Math.ceil(this.maxTime * 100) / 100;
                this.elTimeRange.forEach(el => { el.max = maxVal; el.value = maxVal; });
            }

            this.lastNow = now;

            this.renderOnce();

            if (this.isPaused) { this._loopRunning = false; return; }

            requestAnimationFrame(() => this.render());

            this.frameCount++;

            if (deltaTime >= 1000) {
                this.fps = (this.frameCount / deltaTime) * 1000;
                this.frameCount = 0;
                this.lastFrameTime = now;
                this.elFramerate.forEach(el => el.innerText = `${this.fps.toFixed(1)} fps`);
            }

            const totalTimeClamp = Math.min(999, this.iTime);
            const maxTimeClamp = Math.min(999, this.maxTime);
            function formatTime(seconds) {
                const m = Math.floor(seconds / 60).toString().padStart(2, '0');
                const s = (seconds % 60).toFixed(1).padStart(4, '0');
                return `${m}:${s}`;
            }

            this.elTotaltime.forEach(el => el.innerText = formatTime(totalTimeClamp));
            this.elMaxtime.forEach(el => el.innerText = formatTime(maxTimeClamp));
        }
    }
    
    const shaderCode = RAW_GLSL_CODE;
    console.log("shader code: " + shaderCode); 
    // Initialize

    
    const container = document.getElementById("sketch");
    const canvas = container.querySelector("canvas"); 
    const sketch = new ShaderSketch(container, canvas, shaderCode);
