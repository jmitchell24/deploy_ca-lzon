<style>
    /*
     * Big history: a vertical scroll through the whole human story, from today at the
     * top to the first stone tools at the bottom, on a log scale (see the script).
     *
     * Layout, left to right inside the track: the progress bar, the group bands (see
     * the data's group list), and the events column: the axis, the leader lines and
     * the events. A coloured block for each period is inserted into the track at the
     * period's top; it takes up room but no time (the scale skips over it), and sticks
     * under the header while its period is on screen until the next one pushes it
     * off. The header sticks to the top; its bottom edge is the reading line, and the
     * readout shows the exact year under it.
     *
     * Site styles are used where they fit: the header's layout, text and buttons are
     * site classes (flex-row, text-*, btn). The rest can't use them (it's drawn by
     * the script or positioned), so it uses the tokens below, copied from the site's
     * sass (sass/lzon/_config-variables.scss), and the site's colour variables, so it
     * follows the theme. Period colours are set per period in the script (PERIODS).
     */
    #bht {
        /* from the site's sass: $spacer-xs/sm/md/lg/xl, $border-md, $border-radius,
           $line-height-sm, $transition-speed-md/lg (font sizes and families: the site's
           text-* / font-size-h* / text-monospace / text-sans-serif classes, set in the
           markup and by the script) */
        --bht-xs: .25rem;
        --bht-sm: .5rem;
        --bht-md: 1rem;
        --bht-lg: 1.5rem;
        --bht-xl: 3rem;
        /* the room under the bottom strip's button box: 1.5em at the page's text size
           ($font-size-base); the veil's box ends there too */
        --bht-foot-gap: calc(1.5 * 1.15rem);
        --bht-border: max(2px, 0.12rem);
        --bht-radius: 0.3rem;
        --bht-lh-sm: 1.25;
        --bht-speed: .3s;
        --bht-speed-lg: .6s;

        /*
         * Three columns: the button column; a thin period band (a border's width), each
         * period's colour from its block down to the next block; then the events: the
         * axis line a little in, its leader lines and the events' labels. The period
         * blocks span the events column, inserted into the track at each period's top.
         */
        /* the padding inside every band and block, at every width */
        --bht-band-pad: var(--bht-sm);
        /* the small gap between the buttons and the timeline's frame */
        --bht-gap: var(--bht-sm);
        /* the button column, in its own rounded border: the buttons, a little padding
           and the border; then the gap after it, where the timeline's frame starts */
        --bht-nw: calc(var(--bht-xl) + 2 * var(--bht-xs) + 2 * var(--bht-border));
        --bht-iw: calc(var(--bht-nw) + var(--bht-gap));
        /* where the events column starts, and the axis line in it */
        /* the period band: no width of its own now (the frame's left side is the edge), just
           its guide marks, off the frame's side */
        --bht-pbw: 0px;
        --bht-ew: calc(var(--bht-iw) + var(--bht-border) + var(--bht-pbw));
        /* the axis, in from the events column's edge by room for each event's clock time
           (left of the axis) */
        --bht-lw: calc(5 * var(--bht-lg));
        --bht-axis: calc(var(--bht-ew) + var(--bht-lw));
        --bht-cw: calc(2 * var(--bht-lg));
        --bht-ev: calc(var(--bht-axis) + var(--bht-cw));

        --bht-line: var(--color-dark);
        --bht-lit: var(--color-tertiary);
        /* the timeline's frame, in the colour of the period being read (--bht-frame-era:
           set by the script), as its thin band */
        --bht-frame-c: color-mix(in oklch, var(--bht-frame-era, var(--bht-line)) 55%, var(--color-darker));
        --bht-bg: var(--color-darker);
        --bht-text: var(--color-lighter);
        --bht-mute: var(--color-light);
        /* the header's height, set by the script: sticky labels sit below it */
        --bht-head-h: calc(2 * var(--bht-xl));

        position: relative;
        margin: var(--bht-lg) 0;
    }

    /* ── header: the year readout over the reading line ──────────────────────── */

    .bht-head {
        position: relative;
        z-index: 4; /* over the frame (.bht-frame, 3) */
        /*
         * The page's own background (sass/lzon/_base.scss: --color-darker under the
         * noise tile on html::before), so the header hides the timeline scrolling under
         * it but looks see-through. Plain CSS, not a clip set from script (that lagged on
         * phones); and not background-attachment: fixed either, which mobile Chrome
         * repaints only once a fast scroll stops. Stuck to the top, the header holds its
         * grain still anyway.
         */
        background: var(--color-darker) url("/img/noise-dark.png") repeat;
        /* room above the readout, as below the button box (.bht-foot) */
        padding: 1.5em 0 var(--bht-sm);
        border-bottom: var(--bht-border) solid var(--bht-line);
    }
    /* light mode's noise tile, as the site switches it */
    body[data-dark-mode="off"] #bht :is(.bht-head, .bht-foot, .bht-veil-top, .bht-veil-top::before, .bht-veil-end, .bht-veil-end::before) { background-image: url("/img/noise-light.png"); }
    #bht.bht-open .bht-head {
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        /* the progress bar's colour, so the frame reads as one */
        border-bottom-color: var(--color-dark);
    }

    .bht-year {
        display: block;
        font-weight: 700;
        line-height: var(--bht-lh-sm);
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
    }
    /*
     * The readout: a main row (the year, the clock time) over a subtext row (years
     * ago, time to midnight), each with its left and right ends apart, sized by the
     * site's text-lg / text-sm. Neither wraps; where text doesn't fit (phones, deep in
     * the timeline) the clock side (left) gives way with an ellipsis rather than
     * push the page wide; the year side (right) always shows whole.
     */
    .bht-read-row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: var(--bht-md);
    }
    .bht-read-row > * { white-space: nowrap; }
    .bht-read-row > :first-child {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .bht-read-row > :last-child { flex-shrink: 0; text-align: right; }
    .bht-ago { display: block; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .bht-swatch {
        flex-shrink: 0;
        width: var(--bht-sm);
        height: var(--bht-sm);
        border-radius: 50%;
        background: var(--bht-era, var(--bht-line));
    }

    /* the period list, shown only while collapsed: each one opens the timeline at its start */
    .bht-legend { margin-top: var(--bht-sm); }
    #bht.bht-open .bht-legend { display: none; }

    /* a matching strip along the bottom of the view while the timeline is on screen,
       hiding it as the header does (same background, see .bht-head); sticky, so it
       settles at the timeline's end once that scrolls into view */
    .bht-foot {
        display: none;
        position: sticky;
        z-index: 4; /* over the frame (.bht-frame, 3) */
        bottom: env(safe-area-inset-bottom, 0px);
        padding-bottom: var(--bht-foot-gap);
        background: var(--color-darker) url("/img/noise-dark.png") repeat;
        border-top: var(--bht-border) solid var(--color-dark);
    }
    #bht.bht-open .bht-foot { display: block; }
    /* no lines under the header or over the strip: the frame (.bht-frame-box) is the edge */
    #bht.bht-open .bht-head { border-bottom-color: transparent; }
    #bht.bht-open .bht-foot { border-top-color: transparent; }

    /* ── track ──────────────────────────────────────────────────────────────── */

    .bht-track { display: none; position: relative; }
    #bht.bht-open .bht-track { display: block; }

    /*
     * The button column, down the far left: held in view between the header and the
     * bottom strip (--bht-head-h, --bht-foot-h: set by the script); back to the top,
     * previous period and previous event at its top, next event, next period and to
     * the bottom at its bottom. Icon-only: the site's .btn-nav-link.
     */
    .bht-progress {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: var(--bht-nw);
        /* under the header and the strip (4) */
        z-index: 2;
        box-sizing: border-box;
        /* (room for its frame, .bht-frame-nav) */
        border: var(--bht-border) solid transparent;
        padding-inline: var(--bht-xs);
    }
    /*
     * A rounded frame around the whole timeline as it shows, as the site's meta boxes
     * are (sass/lzon/_component-meta.scss: $border-md in --color-dark, solid as in a
     * .meta-stack, $border-radius). Its sides run the timeline's whole length (the
     * header and strip, over it, hide what's past them); its top edge sticks right
     * under the header and its bottom edge right above the strip, each with its two
     * rounded corners, so all four show wherever you are, the very end included.
     */
    .bht-frame {
        position: absolute;
        /* right of the button column and its gap */
        inset: 0 0 0 var(--bht-iw);
        z-index: 3;
        pointer-events: none;
        box-sizing: border-box;
        border: var(--bht-border) solid var(--bht-frame-c);
        border-block: 0;
        transition: border-color var(--bht-speed) ease;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }
    .bht-frame-top,
    .bht-frame-bottom {
        position: sticky;
        /* out over the sides, to draw the corners onto them */
        margin-inline: calc(-1 * var(--bht-border));
        height: calc(var(--bht-radius) + var(--bht-border));
        box-sizing: border-box;
        border: var(--bht-border) solid var(--bht-frame-c);
        transition: inherit;
    }
    /* the button column's frame: the same, round the column, in the line colour */
    .bht-frame.bht-frame-nav {
        right: auto;
        left: 0;
        width: var(--bht-nw);
        --bht-frame-c: var(--color-dark);
    }
    .bht-frame-top {
        top: var(--bht-head-h);
        border-bottom: 0;
        border-radius: var(--bht-radius) var(--bht-radius) 0 0;
    }
    .bht-frame-bottom {
        bottom: var(--bht-foot-h, 0px);
        border-top: 0;
        border-radius: 0 0 var(--bht-radius) var(--bht-radius);
    }
    /* just outside each curve, the page's colour, so the frame's straight sides (drawn
       under the corner pieces) don't show past it: on an overlay over the piece's whole
       border box (its own background would be clipped to the curve); clear inside the
       curve, so the piece's border shows */
    .bht-frame-top::before,
    .bht-frame-bottom::before {
        content: "";
        position: absolute;
        left: calc(-1 * var(--bht-border));
        right: calc(-1 * var(--bht-border));
        --bht-r: var(--bht-radius);
        background-size: var(--bht-r) var(--bht-r);
        background-repeat: no-repeat;
    }
    .bht-frame-top::before {
        top: calc(-1 * var(--bht-border));
        bottom: 0;
        background-image:
            radial-gradient(circle at 100% 100%, transparent calc(var(--bht-r) - .5px), var(--color-darker) var(--bht-r)),
            radial-gradient(circle at 0 100%, transparent calc(var(--bht-r) - .5px), var(--color-darker) var(--bht-r));
        background-position: left top, right top;
    }
    .bht-frame-bottom::before {
        top: 0;
        bottom: calc(-1 * var(--bht-border));
        background-image:
            radial-gradient(circle at 100% 0, transparent calc(var(--bht-r) - .5px), var(--color-darker) var(--bht-r)),
            radial-gradient(circle at 0 0, transparent calc(var(--bht-r) - .5px), var(--color-darker) var(--bht-r));
        background-position: left bottom, right bottom;
    }
    /* the column runs the track's full height; its top group sticks under the header,
       its bottom group to the bottom of the screen just above the strip, each on its
       own, so the bottom buttons show even before the timeline fills the screen */
    .bht-nav {
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }
    .bht-nav-group { display: flex; flex-direction: column; gap: var(--bht-xs); position: sticky; }
    /* (level with the frame's top and bottom edges) */
    .bht-nav-group:first-child { top: calc(var(--bht-head-h) + var(--bht-border)); padding-top: var(--bht-xs); }
    .bht-nav-group:last-child { bottom: calc(var(--bht-foot-h, 0px) + var(--bht-border)); padding-bottom: var(--bht-xs); }
    .bht-nav .btn-nav-link { width: 100%; aspect-ratio: 1; max-height: var(--bht-xl); padding: 0; }
    /* each band's label rides along at the top of the view while its band is on screen */
    /* sticks right at the header's line, so all the room above the text is its own
       padding: the same at rest (at the top of its band) as stuck */
    .bht-band-label {
        position: sticky;
        top: var(--bht-head-h);
        display: block;
        padding: calc(var(--bht-sm) + var(--bht-xs)) var(--bht-sm) var(--bht-sm);
        line-height: var(--bht-lh-sm);
        color: var(--bht-text);
    }
    .bht-band-label b { display: block; font-weight: 600; }

    /*
     * Period blocks. Each has a slot (absolute, positioned by the script) from its
     * block's place in the track down to the next block; the block sits at the top of
     * its slot and sticks right under the header while the slot is on screen, so the
     * next one pushes it off. Solid (the colour over the page's), as they cover the
     * events scrolling under them.
     */
    .bht-slot {
        position: absolute;
        left: var(--bht-ew);
        right: 0;
        z-index: 2;
        pointer-events: none;
    }
    .bht-block {
        position: sticky;
        top: var(--bht-head-h);
        box-sizing: border-box;
        padding: calc(var(--bht-sm) + var(--bht-xs)) var(--bht-band-pad) var(--bht-sm);
        line-height: var(--bht-lh-sm);
        color: var(--bht-text);
        background: color-mix(in oklch, var(--bht-era) 35%, var(--color-darker));
        pointer-events: auto;
    }
    .bht-slot-period { z-index: 1; }
    /* stuck at the top, a period's block turns its band's colour */
    .bht-slot-period .bht-block { transition: background-color var(--bht-speed) ease; }
    .bht-slot-period .bht-block.bht-stuck { background: color-mix(in oklch, var(--bht-era) 55%, var(--color-darker)); }
    /* a period's thin band: beside the events column, from its block down to the next */
    .bht-pband {
        position: absolute;
        /* (just inside the frame's left side, to just inside its right side: no fill,
           just the guide marks at each side) */
        left: calc(var(--bht-iw) + var(--bht-border));
        right: var(--bht-border);
        pointer-events: none;
    }
    /*
     * Guide marks off the frame's left and right sides, in the frame's colour: short ticks
     * scrolling with the timeline, evenly spaced so about ten show between the header
     * and the strip at any point (a tenth of the screen's height less the header and
     * strip). Kept in step across the bands: each starts its pattern at the track's
     * top (--bht-y, its own top in the track: set by the script).
     */
    .bht-pband::before,
    .bht-pband::after {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        width: var(--bht-sm);
        --bht-guide: calc((100vh - var(--bht-head-h) - var(--bht-foot-h, 0px)) / 10);
        --bht-guide: calc((100svh - var(--bht-head-h) - var(--bht-foot-h, 0px)) / 10);
        /* one tick per tile, tiled down (so an offset keeps the bands in step) */
        background: linear-gradient(var(--bht-frame-c) 0 var(--bht-border), transparent 0) repeat-y;
        background-size: 100% var(--bht-guide);
        background-position: 0 calc(-1 * var(--bht-y, 0px));
        pointer-events: none;
    }
    .bht-pband::before { left: 0; }
    .bht-pband::after { right: 0; }
    .bht-block b { display: block; font-weight: 600; overflow-wrap: anywhere; }
    .bht-block small { display: block; margin-top: var(--bht-xs); color: var(--bht-mute); }
    .bht-block .bht-block-range { margin-top: var(--bht-xs); }
    /* the period's summary and dates in the body text's colour */
    .bht-block :is(.bht-block-note, .bht-block-range) { color: var(--bht-text); }

    /* the axis line */
    .bht-axis {
        position: absolute;
        top: 0;
        left: calc(var(--bht-axis) - var(--bht-sm));
        width: var(--bht-sm);
        border-right: var(--bht-border) solid var(--bht-line);
    }
    /* events: a leader line from the axis, and the label */
    /* an S-bend from the axis to the label: ::before the first half, ::after the second */
    .bht-link {
        position: absolute;
        left: var(--bht-axis);
        width: var(--bht-cw);
        --bht-r: min(var(--bht-radius), 50%);
    }
    .bht-link::before,
    .bht-link::after {
        content: "";
        position: absolute;
        box-sizing: border-box;
        width: 50%;
        height: 50%;
        border: 0 solid var(--bht-line);
    }
    .bht-link::before { left: 0; top: 0; border-top-width: var(--bht-border); border-right-width: var(--bht-border); border-top-right-radius: var(--bht-r); }
    /* one stroke wider, so its vertical lines up under the first half's */
    .bht-link::after  { right: 0; bottom: 0; width: calc(50% + var(--bht-border)); border-bottom-width: var(--bht-border); border-left-width: var(--bht-border); border-bottom-left-radius: var(--bht-r); }
    /* going up: the same shape, flipped */
    .bht-link.bht-up { transform: scaleY(-1); }
    /* the same leader mirrored to the left of the axis, its clock time hanging under it */
    .bht-link.bht-link-l { left: calc(var(--bht-axis) - var(--bht-cw)); transform: scaleX(-1); }
    .bht-link.bht-link-l.bht-up { transform: scale(-1, -1); }
    .bht-clock-at {
        position: absolute;
        right: calc(100% - var(--bht-axis) + var(--bht-band-pad));
        padding-top: calc(var(--bht-sm) + var(--bht-xs));
        /* no wider than the room left of the axis */
        max-width: calc(var(--bht-lw) - 2 * var(--bht-band-pad));
        text-align: right;
        line-height: var(--bht-lh-sm);
        /* accented, as the event's date is (.bht-when) */
        color: var(--bht-lit);
        font-variant-numeric: tabular-nums;
    }
    .bht-clock-at > span { display: block; }
    /* the time left to midnight, muted as the date's "years ago" is (.bht-when-ago) */
    .bht-clock-at .bht-clock-at-left { color: var(--bht-mute); overflow-wrap: anywhere; }
    /* level: one straight line */
    .bht-link.bht-flat { height: 0 !important; }
    .bht-link.bht-flat::before { width: 100%; border-right-width: 0; border-radius: 0; }
    .bht-link.bht-flat::after { display: none; }

    .bht-label {
        position: absolute;
        /* inset from the timeline's axis line, and from its leader line above, as a
           band's name is from its band's edges; it hangs under the leader's end */
        left: calc(var(--bht-axis) + var(--bht-band-pad));
        /* in from the frame's right side as far as from the axis on the left */
        right: calc(var(--bht-band-pad) + var(--bht-border));
        padding: calc(var(--bht-sm) + var(--bht-xs)) 0 0;
        line-height: var(--bht-lh-sm);
        color: var(--bht-text);
    }
    .bht-when {
        display: block;
        color: var(--bht-lit);
        font-variant-numeric: tabular-nums;
    }
    /* on its own line under the date */
    .bht-when-ago { display: block; color: var(--bht-mute); }
    /* bold as a band's name (.bht-band-label b); !important over the site's .text-serif,
       which sets its own weight that way */
    .bht-what  { display: block; font-weight: 600 !important; }
    /* the summary in the body text's colour, as a period's */
    .bht-why { display: block; color: var(--bht-text); }
    /* hidden by the script's settings (HIDE_EVENT_SUMMARIES, HIDE_PERIOD_SUMMARIES) */
    #bht.bht-hide-event-summaries .bht-why,
    #bht.bht-hide-period-summaries .bht-block .bht-block-note { display: none; }

    /*
     * The veil: while the timeline starts low on the screen (too little of it showing
     * to read: see veil() in the script), all of it is hidden and a large centred
     * "scroll to reveal" stands in at its top, in a dashed box like the site's meta
     * box (sass/lzon/_component-meta.scss: dashed $border-md in --color-dark,
     * $border-radius) down to near the bottom of the screen; scrolled up far enough,
     * the two cross-fade ($transition-speed-lg).
     */
    /*
     * The veil's box is laid out by the browser alone, so it holds steady while
     * scrolling (sizing it from script on scroll lagged behind on phones): the veil
     * draws the top and sides, scrolling with the page and running well past the
     * bottom of the screen; its bottom edge is a short piece stuck --bht-foot-gap
     * above the bottom of the screen (as the button strip is), whose background, the
     * page's, hides the sides where it overlaps them, and whose ::before / ::after hide
     * them below it.
     */
    .bht-veil {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 100vh;
        height: 100lvh;
        box-sizing: border-box;
        /* just the sides: the top edge (with the text) and the bottom edge are their own,
           each sticking to its end of the screen (.bht-veil-top, .bht-veil-end) */
        padding: 0 var(--bht-md);
        border: var(--bht-border) dashed var(--color-dark);
        border-block: 0;
        /* the edges' covers (their ::before) go no further than the box: not over the
           page above or below it (clip, not hidden: no scroll box, so the edges still
           stick; only up and down, as the edges and covers reach out over the sides) */
        overflow-x: visible;
        overflow-y: clip;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        pointer-events: none;
        opacity: 0;
        transition: opacity var(--bht-speed-lg) ease;
    }
    .bht-veil-icon { color: var(--color-primary); }
    /* the top edge and the text under it, stuck to the top of the screen while the box
       runs off it, so the text stays in view (the bottom edge's counterpart) */
    .bht-veil-top {
        position: sticky;
        /* the header's room above it (1.5em: .bht-head), as the bottom edge has below it;
           its cover fills that room */
        top: calc(env(safe-area-inset-top, 0px) + var(--bht-foot-gap));
        align-self: stretch;
        display: flex;
        flex-direction: column;
        align-items: center;
        /* out over the veil's side borders, to draw its own */
        margin-inline: calc(-1 * (var(--bht-md) + var(--bht-border)));
        /* the text as far down from the top as the year row is (the header's top padding) */
        padding: var(--bht-foot-gap) var(--bht-md) 0;
        border: var(--bht-border) dashed var(--color-dark);
        border-bottom: 0;
        border-radius: var(--bht-radius) var(--bht-radius) 0 0;
