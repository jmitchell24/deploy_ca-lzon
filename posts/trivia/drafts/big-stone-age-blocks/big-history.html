<script>
    (() => {
        "use strict";

        // ── Settings ────────────────────────────────────────────────────────────

        /** Hide every event's summary (just its date and title), at every width. */
        const HIDE_EVENT_SUMMARIES = true;
        /** Hide every period's summary (just its title and dates), at every width. */
        const HIDE_PERIOD_SUMMARIES = false;

        /** The track's whole height in px, now to START_AGO. */
        const SCROLL_PX = 33_000;

        /**
         * The scale is base-10 log of (years ago + LOG_OFFSET): each power of ten takes the
         * same height. The offset keeps "now" (0 years ago) finite; bigger values give the
         * last few years less room.
         */
        const LOG_OFFSET = 1;

        /** Empty room above today and below the oldest point, in rem (the site's $spacer-xl). */
        const PAD_REM = 3;

        /** Space between two event labels, in rem (the site's $spacer-sm). */
        const LABEL_GAP_REM = 0.5;

        // ── Data ────────────────────────────────────────────────────────────────
        // The periods and events are in big-history.markdown, beside the post's
        // index.md, which includes it rendered (the include_md shortcode) as a hidden
        // block just above this file; read here. Its comment says how to write it. Any
        // entry that can't be read is listed in a red box above the timeline, and in
        // the console, and left out.

        /**
         * A period on the timeline.
         * @typedef {object} Period
         * @property {string} name      Its name, on its block.
         * @property {string} [group]   The key of the group band it belongs to (none now).
         * @property {{ago?: number, year?: number}} end When it ends; it starts where the previous one ends (the first at START_AGO).
         * @property {string} color     Any CSS colour.
         * @property {string} [note]    Its summary (markup, rendered from the markdown).
         */

        /**
         * An event on the timeline.
         * @typedef {object} TimelineEvent
         * @property {number} [ago]     When, in years ago (shown as "c. … years ago").
         * @property {number} [year]    Or when, as a year (BCE negative; a day's date gives a fraction of one).
         * @property {boolean} [approx] For a `year`: prefix "c.".
         * @property {string} what      What happened.
         * @property {string} [why]     Its summary (markup, rendered from the markdown).
         * @property {string} [when]    Overrides the date text.
         */

        /** The data block (big-history.markdown, rendered). */
        const dataEl = document.getElementById("bht-data");

        /** Problems found reading the data, shown above the timeline (see showProblems). */
        const problems = [];

        /**
         * Notes a problem with the data.
         * @param {string} where Which entry (or part of the file).
         * @param {string} what What's wrong.
         */
        function problem(where, what) {
            problems.push({ where, what });
            console.error(`big-history.markdown: ${where}: ${what}`);
        }

        if (!dataEl) problem("the post", 'no data: include big-history.markdown above big-history.html (include_md, id="bht-data")');

        /**
         * A "yyyy-mm-dd" date as a fractional year (so 2026-07-02 is about 2026.5). A
         * leading "-" is BCE, on the same footing as a year (-3200-01-01 is the start of
         * 3200 BCE). Undefined for a day that doesn't exist.
         * @param {string} date
         * @returns {number | undefined}
         */
        function dateYear(date) {
            const m = /^(-?)(\d{4,})-(\d{2})-(\d{2})$/.exec(date.trim());
            if (!m) return undefined;
            const year = Number(m[1] + m[2]), month = Number(m[3]), day = Number(m[4]);
            // Date.UTC treats years 0–99 as 1900s: set the year separately
            const at = (y, mo, d) => { const t = new Date(Date.UTC(2000, mo, d)); t.setUTCFullYear(y); return t; };
            const t = at(year, month - 1, day);
            if (month < 1 || month > 12 || t.getUTCDate() !== day) return undefined;
            const start = at(year, 0, 1).getTime();
            return year + (t.getTime() - start) / (at(year + 1, 0, 1).getTime() - start);
        }

        /**
         * Reads a date as written in the data: "2026-07-19", "1605", "399 BCE",
         * "c. 2000 BCE", "13,000 years ago", "2.75 million years ago", "present".
         * @param {string} text
         * @returns {{ ago?: number, year?: number, approx?: boolean } | null} null if it can't.
         */
        function readDate(text) {
            let t = text.trim().replace(/\s+/g, " ");
            const approx = /^c\.?\s/i.test(t) || /^c\.\S/i.test(t);
            t = t.replace(/^c\.?\s*/i, "");
            if (/^(present|now|today)$/i.test(t)) return { ago: 0 };
            if (/^-?\d{4,}-\d{2}-\d{2}$/.test(t)) {
                const year = dateYear(t);
                return year === undefined ? null : { year, approx };
            }
            let m = /^(\d[\d,]*(?:\.\d+)?)\s*(million|thousand)?\s+(?:years|yrs)\s+ago$/i.exec(t);
            if (m) {
                const n = Number(m[1].replace(/,/g, ""));
                const scale = { million: 1e6, thousand: 1e3 }[m[2]?.toLowerCase()] ?? 1;
                return Number.isFinite(n) ? { ago: n * scale } : null;
            }
            m = /^(\d[\d,]*)\s*(BCE|BC|CE|AD)?$/i.exec(t);
            if (m) {
                const n = Number(m[1].replace(/,/g, ""));
                if (!Number.isFinite(n) || n === 0) return null;
                return { year: /^bc/i.test(m[2] ?? "") ? -n : n, approx };
            }
            return null;
        }

        /**
         * An entry's title: its heading's text (comments left out), less any leading
         * number ("12. Title" → "Title").
         * @param {Element} h
         * @returns {string}
         */
        const titleOf = h => h.textContent.trim().replace(/^\d+[a-z]?\.\s+/i, "");

        /**
         * Reads the data block: "# Periods" and "# Events" sections, each "## " heading
         * an entry, with what follows it until the next heading.
         * @returns {{ periods: Period[], events: TimelineEvent[] }}
         */
        function readData() {
            const periods = [], events = [];
            if (!dataEl) return { periods, events };
            /** @type {"periods" | "events" | null} */
            let section = null;
            /** @type {{ title: string, nodes: Element[], section: string } | null} */
            let entry = null;
            const entries = [];
            // entries under a heading that isn't a section, counted for one problem each
            let stray = null;
            const flushStray = () => {
                if (stray?.count) problem(stray.where, `${stray.why}; its ${stray.count} entr${stray.count === 1 ? "y" : "ies"} left out`);
                stray = null;
            };
            for (const node of dataEl.children) {
                if (node.tagName === "H1") {
                    flushStray();
                    const name = node.textContent.trim().toLowerCase();
                    section = name === "periods" || name === "events" ? name : null;
                    if (!section) stray = { where: `"# ${node.textContent.trim()}"`, why: 'not a section this reads ("# Periods" or "# Events")', count: 0 };
                    entry = null;
                } else if (node.tagName === "H2") {
                    entry = { title: titleOf(node), nodes: [], section };
                    if (section) entries.push(entry);
                    else if (stray) stray.count++;
                    else {
                        stray = { where: "the file", why: 'entries before any "# Periods" or "# Events" heading', count: 1 };
                    }
                } else if (entry) {
                    entry.nodes.push(node);
                } else if (node.textContent.trim()) {
                    problem(`"${node.textContent.trim().slice(0, 40)}…"`, 'text before any "## " entry: left out');
                }
            }

            flushStray();

            for (const e of entries) {
                if (e.section === "periods") {
                    const where = `Period "${e.title}"`;
                    const nodes = [...e.nodes];
                    const settings = {};
                    if (nodes[0]?.tagName === "UL") {
                        for (const li of nodes.shift().children) {
                            const m = /^\s*([a-z]+)\s*:\s*(.*?)\s*$/i.exec(li.textContent);
                            if (!m) { problem(where, `can't read "${li.textContent.trim()}" (want "- key: value")`); continue; }
                            const key = m[1].toLowerCase();
                            if (!["ends", "color", "group"].includes(key)) problem(where, `unknown setting "${m[1]}" (ends, color)`);
                            else settings[key] = m[2];
                        }
                    } else {
                        problem(where, 'no settings: a "- ends: …" and "- color: …" list straight under the heading');
                    }
                    // (left out without a readable end: the period before it runs on in its place)
                    if (settings.ends === undefined) {
                        problem(where, 'no "- ends:": left out');
                        continue;
                    }
                    const d = readDate(settings.ends);
                    if (!d) {
                        problem(where, `can't read the date "${settings.ends}": left out`);
                        continue;
                    }
                    const end = d.ago !== undefined ? { ago: d.ago } : { year: d.year };
                    if (!settings.color) problem(where, 'no "- color:" (grey for now)');
                    const note = nodes.map(n => n.outerHTML).join("").trim();
                    periods.push({ name: e.title, group: settings.group, end, color: settings.color || "oklch(60% 0 0)", note: note || undefined });
                } else {
                    const where = `Event "${e.title}"`;
                    const nodes = [...e.nodes];
                    const first = nodes[0];
                    if (!first || first.tagName !== "P") {
                        problem(where, "no date on the line under the heading: left out");
                        continue;
                    }
                    // the date is the first line; anything after it on the same paragraph
                    // (no blank line between) belongs to the summary
                    const [line, ...rest] = first.innerHTML.split(/\n|<br\s*\/?>/i);
                    const dateText = line.replace(/<[^>]*>/g, "").trim();
                    const d = readDate(dateText);
                    if (!d) {
                        problem(where, `can't read the date "${dateText}": left out`);
                        continue;
                    }
                    nodes.shift();
                    const lead = rest.join("\n").trim();
                    const why = (lead ? `<p>${lead}</p>` : "") + nodes.map(n => n.outerHTML).join("");
                    events.push({ ...d, what: e.title, why: why.trim() || undefined });
                }
            }
            if (!periods.length) problem("the file", 'no periods (a "# Periods" section with "## " entries)');
            if (!events.length) problem("the file", 'no events (a "# Events" section with "## " entries)');
            return { periods, events };
        }

        /**
         * Lists the problems found reading the data in a red box just above the
         * timeline, so they're obvious while writing (nothing shows when there are none).
         */
        function showProblems() {
            if (!problems.length) return;
            const box = document.createElement("div");
            box.className = "bht-problems text-sans-serif text-sm";
            const head = document.createElement("b");
            head.textContent = `big-history.markdown: ${problems.length} problem${problems.length === 1 ? "" : "s"}`;
            const list = document.createElement("ul");
            for (const p of problems) {
                const li = document.createElement("li");
                const where = document.createElement("b");
                where.textContent = p.where;
                li.append(where, `: ${p.what}`);
                list.append(li);
            }
            box.append(head, list);
            (document.getElementById("bht") ?? document.body).before(box);
        }

        /**
         * An element holding markup.
         * @param {string} tag
         * @param {string} className
         * @param {string} html
         * @returns {HTMLElement}
         */
        function elHTML(tag, className, html) {
            const e = el(tag, className);
            e.innerHTML = html;
            return e;
        }

        const data = readData();

        /** @type {Period[]} The periods, oldest first; the last one runs to now. */
        const PERIODS = data.periods;

        /** The group bands' labels and colours, by key (none now). */
        const GROUPS = {};

        /** @type {TimelineEvent[]} The events, any order. */
        const EVENTS = data.events;

        showProblems();

        // ── Time ────────────────────────────────────────────────────────────────
        // Positions are in "x": a fractional calendar year, BCE negative. There's no
        // year 0 in the calendar; x in [0, 1) reads as 1 CE.

        const today = new Date();
        const startOfYear = new Date(today.getFullYear(), 0, 1);
        /** Now as x: this year plus how far through it we are. */
        const NOW = today.getFullYear() + (today - startOfYear) / (365.25 * 864e5);
        /** How far back the timeline goes, in years ago: to its oldest event. */
        // (at least a year, so a file with no readable events still draws)
        const START_AGO = Math.max(1, ...EVENTS.map(ev => (ev.ago !== undefined ? ev.ago : NOW - ev.year)));
        /** The oldest point, at the bottom of the track, as x. */
        const X0 = NOW - START_AGO;
        /** The track's length in px, top (now) to bottom (START_AGO). */
        const SPAN_PX = SCROLL_PX;
        /** PAD_REM in px. */
        const PAD = PAD_REM * parseFloat(getComputedStyle(document.documentElement).fontSize);
        /** LABEL_GAP_REM in px. */
        const LABEL_GAP = LABEL_GAP_REM * parseFloat(getComputedStyle(document.documentElement).fontSize);
        /** Pixels per power of ten. */
        const PX_PER_DECADE = SPAN_PX / (Math.log10(START_AGO + LOG_OFFSET) - Math.log10(LOG_OFFSET));

        const fmt = n => Math.round(n).toLocaleString("en-US");

        /**
         * A point in time as x.
         * @param {{ago?: number, year?: number}} p The point.
         * @returns {number}
         */
        const toX = p => (p.ago !== undefined ? NOW - p.ago : p.year);

        /**
         * x on the scale alone, in px from the present (0) to the oldest point
         * (SPAN_PX): log10 of years ago (plus LOG_OFFSET). The period blocks add no time,
         * so progress through the timeline is measured on this.
         * @param {number} x
         * @returns {number}
         */
        const scalePx = x => (Math.log10(Math.max(0, NOW - x) + LOG_OFFSET) - Math.log10(LOG_OFFSET)) * PX_PER_DECADE;

        /**
         * scalePx backwards, clamped to the span.
         * @param {number} px
         * @returns {number}
         */
        function fromScalePx(px) {
            const ago = LOG_OFFSET * 10 ** (Math.min(SPAN_PX, Math.max(0, px)) / PX_PER_DECADE) - LOG_OFFSET;
            return Math.min(NOW, Math.max(X0, NOW - ago));
        }

        /**
         * The blocks inserted into the track (periods), newest first; each with its edge `x` and its
         * height `h` (measured in layout()). They're stacked into the track on top of the
         * scale, so they take up room but no time.
         * @type {{ kind: "period", x: number, h: number, slot: HTMLElement, block: HTMLElement, item: object }[]}
         */
        const inserts = [];
        // each insert also has `shift` (room left above it for an event label, which
        // like the block itself takes no time) and `top` (where its block starts); both
        // set by layout()

        /**
         * Where each insert starts in the track, in order (set by layout(): inserts at
         * the present start at the very top; the rest at their edge on the scale, below
         * the inserts above, and shifted down past any event label still there).
         * @returns {number[]}
         */
        function insertTops() {
            return inserts.map(ins => ins.top);
        }

        /**
         * x as a pixel offset from the top of the track: the present PAD below the top,
         * then the scale downward, pushed down by every insert above. A point exactly on
         * an edge comes just under the inserts there.
         * @param {number} x
         * @returns {number}
         */
        function toPx(x) {
            let h = 0;
            for (const ins of inserts) if (ins.x >= x) h += ins.shift + ins.h;
            return PAD + scalePx(x) + h;
        }

        /**
         * A pixel offset from the top of the track as x (toPx backwards), clamped to the
         * span; anywhere inside an insert reads as its edge.
         * @param {number} px
         * @returns {number}
         */
        function fromPx(px) {
            const tops = insertTops();
            let off = 0;
            for (let i = 0; i < inserts.length; i++) {
                // the insert, with the room left above it, reads as its edge
                if (px < tops[i] - inserts[i].shift) break;
                if (px < tops[i] + inserts[i].h) return inserts[i].x;
                off += inserts[i].shift + inserts[i].h;
            }
            return fromScalePx(px - PAD - off);
        }

        /**
         * The insert for a period or age.
         * @param {object} item
         * @returns {(typeof inserts)[number]}
         */
        const insertOf = item => inserts.find(ins => ins.item === item);

        /**
         * Where a period's or age's block starts in the track.
         * @param {object} item
         * @returns {number}
         */
        const insertTop = item => insertTops()[inserts.indexOf(insertOf(item))];

        /**
         * The age a period is in.
         * @param {object} p
         * @returns {object | undefined}
         */
        const ageOf = p => groups.find(g => p.from >= g.from && p.to <= g.to);

        /**
         * The height stuck under the header over a period: its block.
         * @param {object} p
         * @returns {number}
         */
        const stuckOver = p => insertOf(p)?.h ?? 0;

        /**
         * The scroll position that brings a period's block to where it sticks, right
         * under the header.
         * @param {object} p
         * @returns {number}
         */
        const scrollYForPeriod = p => scrollYForPx(insertTop(p));

        /**
         * A calendar year as text: "3,200 BCE" or "1969 CE".
         * @param {number} x
         * @returns {string}
         */
        function yearText(x) {
            const y = Math.floor(x);
            return y < 0 ? `${fmt(-y)} BCE` : `${Math.max(1, y)} CE`;
        }

        /** Seconds in the day the whole span is squeezed into (see clockText). */
        const DAY_S = 24 * 60 * 60;

        /**
         * A time of day on a 12-hour clock, "10:33pm" ("12:00am" at either midnight:
         * the start of the timeline and the present).
         * @param {number} t Seconds since the day began (the start of the timeline).
         * @returns {string}
         */
        function clockText(t) {
            const s = Math.min(DAY_S, Math.floor(t + 1e-6));
            const h24 = Math.floor(s / 3600) % 24;
            const h12 = h24 % 12 || 12;
            const min = String(Math.floor(s / 60) % 60).padStart(2, "0");
            return `${h12}:${min}${h24 < 12 ? "am" : "pm"}`;
        }

        /**
         * Time left until midnight as text, zero parts dropped: seconds always short
         * ("2 h 10 min 54 s", "5 min 14 s", "38.4 s", "0.26 s": decimals once under a
         * minute, where a second is decades); a last part of minutes or hours spelled
         * out ("2 h 10 minutes", "2 hours").
         * @param {number} left Seconds.
         * @returns {string}
         */
        function untilText(left) {
            if (left < 1) return `${Number(left.toFixed(2))} s`;
            if (left < 60) return `${Number(left.toFixed(1))} s`;
            const s = Math.floor(left);
            const parts = [
                [Math.floor(s / 3600), "h", "hour", "hours"],
                [Math.floor(s / 60) % 60, "min", "minute", "minutes"],
                [s % 60, "s"],
            ].filter(([n]) => n > 0);
            return parts.map(([n, short, one, many], k) =>
                k === parts.length - 1 && one ? `${n} ${n === 1 ? one : many}` : `${n} ${short}`).join(" ");
        }

        /**
         * Time left until midnight in one rounded unit, unspaced: "13ms", "3s", "4m", "2h".
         * @param {number} left Seconds.
         * @returns {string}
         */
        function roughUntilText(left) {
            // under a second (the last few decades), in milliseconds: "13ms"
            if (left < 0.9995) return `${Math.max(1, Math.round(left * 1000))}ms`;
            if (left < 59.5) return `${Math.round(left)}s`;
            if (left < 3570) return `${Math.round(left / 60)}m`;
            return `${Math.round(left / 3600)}h`;
        }

        /**
         * A span of years as text: "3.3 million years ago", "51,200 years ago".
         * @param {number} ago Years before now.
         * @returns {string}
         */
        function agoText(ago) {
            if (ago >= 1e6) return `${Number((ago / 1e6).toPrecision(3))} million years ago`;
            return `${fmt(ago)} years ago`;
        }

        /**
         * How long ago, for a calendar date: "4 months ago", "1 year ago", "534 years ago".
         * @param {number} ago Years before now.
         * @returns {string}
         */
        function sinceText(ago) {
            if (ago < 1) {
                const months = Math.max(1, Math.round(ago * 12));
                return `${months} ${months === 1 ? "month" : "months"} ago`;
            }
            const years = Math.round(ago);
            return years === 1 ? "1 year ago" : agoText(years);
        }

        /**
         * An event's date text.
         * @param {TimelineEvent} ev
         * @returns {string}
         */
        function whenText(ev) {
            if (ev.when) return ev.when;
            if (ev.ago !== undefined) return `c. ${agoText(ev.ago)}`;
            return (ev.approx ? "c. " : "") + yearText(ev.year);
        }

        // ── Periods ─────────────────────────────────────────────────────────────

        /** Each period with its start and end as x. */
        const periods = PERIODS.map((p, i) => ({
            ...p,
            from: i === 0 ? X0 : toX(PERIODS[i - 1].end),
            to: i === PERIODS.length - 1 ? NOW : toX(p.end),
            // as given (ago or year), for its date range text; the last runs to now
            start: i === 0 ? { ago: START_AGO } : PERIODS[i - 1].end,
            end: i === PERIODS.length - 1 ? null : p.end,
        }));

        /**
         * A period's dates as text, newest first (as the timeline reads, top down), in
         * the terms they're given in, sharing the unit where both ends have it:
         * "300,000 – 3.3 million years ago", "3,300 BCE – 12,000 years ago",
         * "1,200 – 3,300 BCE", "500 CE – 500 BCE", "present – 1945 CE".
         * @param {{ago?: number, year?: number}} start
         * @param {{ago?: number, year?: number} | null} end null: runs to now.
         * @returns {string}
         */
        function rangeText(start, end) {
            const ago = n => agoText(n).replace(/ years ago$/, "");
            const year = y => (y < 0 ? fmt(-y) : String(Math.max(1, y)));
            const era = y => (y < 0 ? "BCE" : "CE");
            const one = b => (b.ago !== undefined ? agoText(b.ago) : yearText(b.year));
            if (!end || end.ago === 0) return `present – ${one(start)}`;
            if (start.ago !== undefined && end.ago !== undefined) return `${ago(end.ago)} – ${agoText(start.ago)}`;
            if (start.year !== undefined && end.year !== undefined && era(start.year) === era(end.year)) {
                return `${year(end.year)} – ${year(start.year)} ${era(start.year)}`;
            }
            return `${one(end)} – ${one(start)}`;
        }

        /** Runs of consecutive periods with the same group, as one band each. */
        const groups = [];
        for (const p of periods) {
            const last = groups.at(-1);
            if (p.group && last?.key === p.group) last.to = p.to;
            else if (p.group) {
                const g = GROUPS[p.group];
                if (!g) console.error(`big-history.html: no group with data-key "${p.group}"`);
                groups.push({ key: p.group, name: g?.name ?? p.group, from: p.from, to: p.to, color: g?.color ?? p.color });
            }
        }

        /**
         * The period at x (clamped to the ends); a period's top edge counts as in it.
         * @param {number} x
         * @returns {(typeof periods)[number]}
         */
        const periodAt = x => periods.find(p => x <= p.to) ?? periods.at(-1);

        // ── Elements ────────────────────────────────────────────────────────────

        const root    = document.getElementById("bht");
        // (before anything is laid out, so the labels and blocks are measured without them)
        root.classList.toggle("bht-hide-event-summaries", HIDE_EVENT_SUMMARIES);
        root.classList.toggle("bht-hide-period-summaries", HIDE_PERIOD_SUMMARIES);
        const head    = root.querySelector(".bht-head");
        const track   = root.querySelector(".bht-track");
        const foot    = root.querySelector(".bht-foot");
        const yearEl  = root.querySelector(".bht-year:not(.bht-clock-time)");
        const agoEl   = root.querySelector(".bht-ago:not(.bht-clock-left)");
        const clockEl = root.querySelector(".bht-clock-time");
        const leftEl  = root.querySelector(".bht-clock-left");
        const legend  = root.querySelector(".bht-legend");
        const topBtn  = root.querySelector(".bht-btn-top");
        const prevBtn = root.querySelector(".bht-btn-prev");
        const prevEvBtn = root.querySelector(".bht-btn-prev-ev");
        const nextEvBtn = root.querySelector(".bht-btn-next-ev");
        const nextBtn = root.querySelector(".bht-btn-next");
        const botBtn  = root.querySelector(".bht-btn-bottom");

        /**
         * Makes an element.
         * @param {string} tag
         * @param {string} [className]
         * @param {string} [text]
         * @returns {HTMLElement}
         */
        function el(tag, className, text) {
            const e = document.createElement(tag);
            if (className) e.className = className;
            if (text !== undefined) e.textContent = text;
            return e;
        }

        // The legend (collapsed only): each period opens the timeline at its start.
        for (const p of periods) {
            const b = el("button", "btn btn-sm");
            b.type = "button";
            const sw = el("i", "bht-swatch");
            sw.style.setProperty("--bht-era", p.color);
            b.append(sw, p.name);
            // its block at the reading line
            b.addEventListener("click", () => { open(); stopGlide(); window.scrollTo({ top: scrollYForPeriod(p), behavior: "instant" }); update(); });
            legend.append(b);
        }

        // ── Building the track (on first open) ──────────────────────────────────

        /** Each event's link and label, for layout. */
        const placed = [];
        let built = false;

        /**
         * A period's slot and block: its name (site text classes: serif font-size-h5),
         * its dates (text-xs) and its note (text-sm).
         * @param {(typeof periods)[number]} p
         * @returns {{ slot: HTMLElement, block: HTMLElement }}
         */
        function makeBlock(p) {
            const slot = el("div", "bht-slot bht-slot-period");
            const block = el("div", "bht-block text-serif");
            block.style.setProperty("--bht-era", p.color);
            block.append(el("b", "font-size-h5", p.name));
            // its dates right under its name, small
            block.append(el("small", "bht-block-range text-xs", rangeText(p.start, p.end)));
            if (p.note) block.append(elHTML("small", "bht-block-note text-sm", p.note));
            slot.append(block);
            return { slot, block };
        }

        /** The axis: it runs to the track's end. */
        let axisEl = null;

        /** Builds the bands, axis and events. */
        function build() {
            const frag = document.createDocumentFragment();
            // newest first
            for (const p of [...periods].reverse()) {
                const { slot, block } = makeBlock(p);
                const band = el("div", "bht-pband");
                band.style.setProperty("--bht-era", p.color);
                inserts.push({ kind: "period", x: p.to, h: 0, shift: 0, top: 0, slot, block, band, item: p });
                frag.append(band, slot);
            }


            const axis = el("div", "bht-axis");
            axisEl = axis;
            frag.append(axis);

            // newest first: top to bottom
            for (const ev of [...EVENTS].sort((a, b) => toX(b) - toX(a))) {
                const x = Math.min(toX(ev), NOW);
                const link = el("span", "bht-link");
                const linkL = el("span", "bht-link bht-link-l");
                // its time on the 24-hour day, under the left-hand mark
                const dayLeft = ((NOW - x) / START_AGO) * DAY_S;
                const clockAt = el("span", "bht-clock-at text-monospace text-xs");
                clockAt.append(el("span", "", clockText(DAY_S - dayLeft)));
                // an event whose date has "(… ago)" after it also gets its time left to midnight
                if (!ev.when && ev.ago === undefined) {
                    clockAt.append(el("span", "bht-clock-at-left text-xs", `${roughUntilText(dayLeft)} to midnight`));
                }
                const label = el("div", "bht-label");
                const when = el("span", "bht-when text-monospace text-xs", whenText(ev));
                // a calendar date also gets how long ago it was, muted
                if (!ev.when && ev.ago === undefined) when.append(el("span", "bht-when-ago", sinceText(NOW - x)));
                // the present: "c. 0 years ago" says nothing, so its date line is today's date,
                // long ("November 16, 2026"), in the reader's own calendar and time, accented as
                // a year is, with no "ago" line under it (unless the data gives it a date line)
                if (ev.ago === 0 && !ev.when) {
                    when.textContent = today.toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" });
                }
                const what = el("span", "bht-what text-serif text-base line-height-sm", ev.what);
                label.append(when, what);
                if (ev.why) {
                    label.append(elHTML("span", "bht-why text-sm", ev.why));
                }
                frag.append(link, linkL, clockAt, label);
                // positioned in layout(), once the blocks are measured
                placed.push({ x, y: 0, link, linkL, clockAt, label, when });
            }

            track.append(frag);
            built = true;
        }

        /**
         * Places the event labels: each one's date line level with its point on the axis if there's
         * room, else pushed down past the one above, so the crowded recent centuries at
         * the top spill down into the emptier past. Then draws each leader line from its
         * point on the axis to its label.
         */
        function layout() {
            if (!built) return;
            // Measure the blocks (their height depends on the width), then everything is
            // placed on the scale with the blocks stacked in.
            for (const ins of inserts) ins.h = ins.block.offsetHeight;

            // One sweep down the track, newest first (at a shared edge the blocks come
            // before the events, which sit just under them). Events keep their true place;
            // each label hangs under its leader line, pushed down only past the label or
            // block above it. A block whose place is still covered by the label above is
            // shifted down past it, and everything after moves down with it.
            const items = placed.map(it => ({ ...it, h: it.label.offsetHeight, anchor: 0, top: 0 }));
            const order = [
                ...inserts.map(ins => ({ ins, x: ins.x, first: 0 })),
                ...items.map(it => ({ it, x: it.x, first: 1 })),
            ].sort((a, b) => b.x - a.x || a.first - b.first);
            let off = 0;      // the inserts so far, with their shifts
            let above = 0;    // the bottom of the last label or block placed
            let labelAbove = false;
            for (const o of order) {
                if (o.ins) {
                    const ins = o.ins;
                    const nominal = (ins.x >= NOW ? 0 : PAD + scalePx(ins.x)) + off;
                    ins.shift = labelAbove ? Math.max(0, above + LABEL_GAP - nominal) : 0;
                    ins.top = nominal + ins.shift;
                    off += ins.shift + ins.h;
                    above = ins.top + ins.h;
                    labelAbove = false;
                } else {
                    const it = o.it;
                    it.y = PAD + scalePx(it.x) + off;
                    it.top = Math.max(it.y, above + (labelAbove ? LABEL_GAP : 0));
                    above = it.top + it.h;
                    labelAbove = true;
                }
            }
            // the steps read each event's place from `placed`
            items.forEach((it, i) => { placed[i].y = it.y; });
            const tops = insertTops();

            let bottom = 0;
            for (const it of items) {
                it.label.style.top = `${it.top}px`;
                const to = it.top + it.anchor;
                const d = to - it.y;
                it.link.classList.toggle("bht-flat", Math.abs(d) < 1);
                it.link.classList.toggle("bht-up", d <= -1);
                it.link.style.top = `${Math.min(it.y, to)}px`;
                it.link.style.height = `${Math.abs(d)}px`;
                // mirrored on the left, with the clock time under it as the label is under the right
                it.linkL.classList.toggle("bht-flat", Math.abs(d) < 1);
                it.linkL.classList.toggle("bht-up", d <= -1);
                it.linkL.style.top = it.link.style.top;
                it.linkL.style.height = it.link.style.height;
                it.clockAt.style.top = `${it.top}px`;
                bottom = Math.max(bottom, it.top + it.h);
            }
            // Ends PAD below the oldest point (or just below the last label, if that's
            // lower), so the page bottoms out at the footer (the reading point runs down
            // to the oldest point over the last stretch: readPx). The oldest band and the
            // axis run all the way, so the timeline meets the bottom line.
            // (on a narrow screen the buttons are a row along the bottom: room for it too,
            // so the last event can scroll clear of it)
            const nav = root.querySelector(".bht-nav");
            // (the row's full height over the track: its buttons, its padding and top line,
            // and the frame's bottom edge under it; summed from the parts, as the row
            // itself may not be laid out yet)
            let rowH = 0;
            if (nav && getComputedStyle(nav).flexDirection.startsWith("row")) {
                const g = getComputedStyle(nav.lastElementChild);
                const btn = nav.querySelector(".btn-nav-link");
                rowH = (btn ? btn.offsetHeight : 0) + parseFloat(g.paddingTop) + parseFloat(g.paddingBottom)
                    + (parseFloat(getComputedStyle(root.querySelector(".bht-frame:not(.bht-frame-nav) .bht-frame-bottom")).borderBottomWidth) || 0);
            }
            const end = Math.max(toPx(X0) + PAD, bottom + LABEL_GAP) + rowH;
            track.style.height = `${end}px`;
            remeasure();
            axisEl.style.height = `${end}px`;

            // Each slot runs from its block down to where the next block starts (or the
            // end), so the next block pushes it off.
            inserts.forEach((ins, i) => {
                const next = inserts.findIndex((o, k) => k > i);
                const bottom = next < 0 ? end : tops[next];
                ins.slot.style.top = `${tops[i]}px`;
                ins.slot.style.height = `${Math.max(bottom - tops[i], ins.h)}px`;
                // the period's band covers the same stretch as its slot
                if (ins.band) {
                    ins.band.style.top = ins.slot.style.top;
                    ins.band.style.height = ins.slot.style.height;
                    ins.band.style.setProperty("--bht-y", ins.slot.style.top);
                }
            });
        }

        // ── Reading the position ────────────────────────────────────────────────

        /**
         * Where the reading line (the header's bottom edge) can get to: the timeline
         * ends a screen short of where the line could reach, so when the track's end
         * meets the bottom strip the line is still `run` px above the oldest point.
         * Over the last `run` px of scrolling the reading point leaves the line and runs
         * down the track at twice the scroll speed, reaching the oldest point just as
         * the track ends (scrolling on past that, it stays there).
         * @returns {{ line: number, ramp: number, run: number }} `line`: the line's offset
         *   into the track now; `ramp`: the offset where the run starts; `run`: its length.
         */
        function reach() {
            const m = metrics();
            // the header sticks at the top, so its line is headH down the screen; until
            // the track reaches it, the line is the track's top
            const line = Math.max(0, window.scrollY + m.headH - m.trackTop);
            return { line, ramp: m.ramp, run: m.run };
        }

        /**
         * The page geometry the scroll-driven parts need, measured once and again only
         * when something changes size (see remeasure()): during scrolling everything is
         * worked out from window.scrollY with plain arithmetic, so no frame forces the
         * browser to lay the page out again (that made scrolling and dragging lag).
         * @type {{ trackTop: number, trackH: number, rootTop: number, headH: number, footH: number, barH: number, thumbH: number, vh: number, ramp: number, run: number } | null}
         */
        let geo = null;

        /** Drops the measured geometry; the next use measures it again. */
        function remeasure() { geo = null; }

        /**
         * The measured geometry (see geo), measuring it if need be.
         * @returns {NonNullable<typeof geo>}
         */
        function metrics() {
            if (geo) return geo;
            const y = window.scrollY;
            const vh = window.innerHeight;
            const trackRect = track.getBoundingClientRect();
            const trackTop = trackRect.top + y;
            const trackH = track.offsetHeight;
            const headH = head.getBoundingClientRect().height;
            const footRect = foot.getBoundingClientRect();
            const footH = footRect.height;
            const maxScroll = document.documentElement.scrollHeight - vh;
            // Where the strip's line sits on screen while it sticks: read off the strip
            // itself when it's stuck (anything along the screen's bottom, a horizontal
            // scrollbar say, lifts it off innerHeight); else the visible bottom (clientHeight,
            // which leaves out such a scrollbar) less its height.
            const footLine = footRect.top < trackRect.bottom - 1 ? footRect.top : document.documentElement.clientHeight - footH;
            // The end: the track's bottom meeting the bottom strip, the last moment the
            // strip sticks (or the page's bottom, if that comes first).
            const endScroll = Math.min(maxScroll, trackTop + trackH - footLine);
            // the line's offset into the track there
            const lineMax = headH - (trackTop - endScroll);
            const run = Math.max(0, toPx(X0) - lineMax);
            geo = {
                trackTop, trackH, headH, footH, footLine, endScroll, vh, run, ramp: lineMax - run,
                rootTop: root.getBoundingClientRect().top + y,
                short: tooShort(vh - headH - footH),
            };
            return geo;
        }

        /**
         * Whether the screen is too short to show the timeline usefully: the room between
         * the header and the bottom strip must hold the tallest period block with room
         * for an event under it (two of the site's $spacer-xl), and the buttons: on a wide
         * screen both groups of the column with a $spacer-xl between them, so they never
         * meet; on a narrow one the row along the bottom, under the block and event.
         * @param {number} room the height between the header and the strip, in px
         * @returns {boolean}
         */
        function tooShort(room) {
            const xl = 3 * parseFloat(getComputedStyle(document.documentElement).fontSize);
            const block = Math.max(0, ...inserts.map(ins => ins.block ? ins.block.offsetHeight : 0));
            const nav = root.querySelector(".bht-nav");
            if (!nav) return room < block + 2 * xl;
            const groups = [...nav.children].map(g => g.offsetHeight);
            if (getComputedStyle(nav).flexDirection.startsWith("row")) {
                return room < block + 2 * xl + Math.max(...groups);
            }
            return room < Math.max(block + 2 * xl, groups[0] + groups[1] + xl);
        }

        /**
         * The reading point's offset into the track: the reading line's, plus the run.
         * @returns {number}
         */
        function readPx() {
            const { line, ramp } = reach();
            return line + Math.max(0, line - ramp);
        }

        /**
         * The x at the reading point, clamped to the span; now while collapsed.
         * @returns {number}
         */
        function readX() {
            if (!root.classList.contains("bht-open")) return NOW;
            if (pinned && Math.abs(window.scrollY - pinned.y) < 1) return pinned.x;
            pinned = null;
            return fromPx(readPx());
        }

        /**
         * A landing that reads exactly: after a period step the page sits on the
         * boundary, but a pixel here can be years, so the readout is pinned to the
         * boundary's exact x and period until the page scrolls again.
         * @type {{ y: number, x: number, p: (typeof periods)[number] } | null}
         */
        let pinned = null;

        /**
         * The period under the reading point (the pinned one, after a period step).
         * @returns {(typeof periods)[number]}
         */
        function currentPeriod() {
            const x = readX();
            return pinned ? pinned.p : periodAt(x);
        }

        /** The width the labels were last laid out for. */
        let laidOutWidth = window.innerWidth;

        /**
         * The last reading taken at that width (where the reader was, and whether inside
         * the timeline), so a width change can put them back: by the time the resize
         * handler runs, the text above has already rewrapped and moved the timeline.
         * @type {{ x: number, inside: boolean } | null}
         */
        let lastRead = null;

        /** How far down the screen the timeline's top can be and still be revealed (a share of the screen height). */
        const REVEAL_AT = 0.4;

        /**
         * Hides the timeline (showing "scroll to reveal" instead) while it starts in the
         * lower part of the screen, where only a sliver of it would show between the
         * header and the bottom strip; reveals it once its top is in the top REVEAL_AT
         * of the screen, and keeps it revealed from there down. On a screen too short
         * for it (tooShort()), hides it throughout, the box saying so.
         */
        function veil() {
            const m = metrics();
            root.classList.toggle("bht-veiled", m.rootTop - window.scrollY > m.vh * REVEAL_AT);
            // too short a screen: the box says so instead, wherever you are
            root.classList.toggle("bht-short", m.short);
        }

        /** Updates the veil, the year readout, and the period band under the reading line. */
        function update() {
            veil();
            // A period's block takes its band's (stronger) colour once it's stuck at the
            // top: its slot has reached the line it sticks at (under the header and its
            // age's block). Worked out from scrollY and the cached geometry: no layout.
            if (built) {
                const m = metrics();
                const line = window.scrollY - m.trackTop + m.headH;
                const firstPeriodIns = inserts.find(ins => ins.kind === "period");
                for (const ins of inserts) {
                    if (ins.kind !== "period") continue;
                    // (a block landed exactly at the top counts: half a pixel's leeway; the
                    // newest period's block, at the track's very top, is always in its full
                    // colour: wherever it shows, it's the period being read)
                    const stuck = line >= ins.top - 0.5 || ins === firstPeriodIns;
                    if (stuck !== ins.stuck) {
                        ins.stuck = stuck;
                        ins.block.classList.toggle("bht-stuck", stuck);
                    }
                }
            }
            const x = readX();
            if (window.innerWidth === laidOutWidth && root.classList.contains("bht-open")) {
                lastRead = { x, inside: reach().line > 0 };
            }
            const ago = NOW - x;
            yearEl.textContent = yearText(x);
            // as on the timeline ("14 years ago", "2.75 million years ago")
            agoEl.textContent = ago < 0.05 ? "Now" : sinceText(ago);
            const left = (ago / START_AGO) * DAY_S;
            clockEl.textContent = clockText(DAY_S - left);
            // one rounded unit, as on the timeline ("11ms", "6m", "16h")
            leftEl.textContent = left < 0.0005 ? "Midnight" : `${roughUntilText(left)} to midnight`;

            const p = pinned ? pinned.p : periodAt(x);
            // the timeline's frame in the colour of the period being read
            if (p !== framed) {
                framed = p;
                root.style.setProperty("--bht-frame-era", p.color);
            }
            // nothing more recent than the newest period, nothing further back than the oldest
            const atTop = window.scrollY <= scrollYFor(NOW) + 1, atEnd = atOldestPoint(x);
            topBtn.disabled = atTop;
            prevBtn.disabled = atTop;
            nextBtn.disabled = p === periods[0] || atEnd;
            botBtn.disabled = atEnd;
            const evX = eventBase();
            prevEvBtn.disabled = !eventFrom(evX, -1);
            nextEvBtn.disabled = !eventFrom(evX, 1);
        }

        let queued = false;
        /** The period whose colour the timeline's frame is in (update()), or null. */
        let framed = null;
        /** Calls update() once on the next frame. */
        function queueUpdate() {
            if (queued) return;
            queued = true;
            requestAnimationFrame(() => { queued = false; update(); });
        }

        /**
         * The page scroll position that puts x on the reading line (now: the track's
         * very top, so the padding above today shows).
         * @param {number} x
         * @returns {number}
         */
        function scrollYFor(x) {
            return scrollYForPx(x >= NOW ? 0 : toPx(Math.max(X0, x)));
        }

        /**
         * The page scroll position that puts a point px into the track on the reading line.
         * @param {number} px
         * @returns {number}
         */
        function scrollYForPx(px) {
            const m = metrics();
            // readPx backwards: past the ramp, the line only needs to go half as far
            const line = px <= m.ramp ? px : (px + m.ramp) / 2;
            return m.trackTop + line - m.headH;
        }

        /**
         * Scrolls so x sits on the reading line, at once.
         * @param {number} x
         */
        function scrollToX(x) {
            stopGlide();
            window.scrollTo({ top: scrollYFor(x), behavior: "instant" });
            update();
        }

        // ── Top / Bottom buttons: an eased glide (native smooth scrolling can't be timed) ──

        /** How long a glide to the top or bottom takes, in ms. */
        const GLIDE_MS = 3000;

        /** How long a step to the next or previous period or event takes, in ms. */
        const PERIOD_GLIDE_MS = 500;

        /**
         * Ease in and out (cubic).
         * @param {number} t 0 to 1.
         * @returns {number}
         */
        const ease = t => (t < 0.5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2);

        /** The running glide's frame request, or 0. */
        let glideFrame = 0;

        /** Stops a running glide where it is. */
        function stopGlide() {
            cancelAnimationFrame(glideFrame);
            glideFrame = 0;
            glideAim = null;
        }

        /** Where a running period or event step is headed (x and its period), or null. */
        let glideAim = null;

        /**
         * Glides the page so x ends up on the reading line, over `ms` (at once, with
         * reduced motion). The reader scrolling (wheel, touch, keys) stops it.
         * @param {number} x
         * @param {number} [ms] How long it takes.
         * @param {(typeof periods)[number]} [pin] Pin the readout to x and this period on landing.
         * @param {number} [to] The scroll position to land on, if not the one that puts x on the line.
         * @param {() => void} [onLand] Called on landing.
         */
        function glideToX(x, ms = GLIDE_MS, pin, to = scrollYFor(x), onLand) {
            stopGlide();
            const land = () => {
                if (pin) pinned = { y: window.scrollY, x, p: pin };
                onLand?.();
                update();
            };
            if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
                window.scrollTo({ top: to, behavior: "instant" });
                return land();
            }
            const from = window.scrollY;
            const start = performance.now();
            const step = now => {
                const t = Math.min(1, (now - start) / ms);
                window.scrollTo({ top: from + (to - from) * ease(t), behavior: "instant" });
                if (t < 1) glideFrame = requestAnimationFrame(step);
                else { stopGlide(); land(); }
            };
            glideFrame = requestAnimationFrame(step);
        }

        for (const type of ["wheel", "touchstart", "keydown"]) {
            window.addEventListener(type, () => { if (glideFrame) stopGlide(); }, { passive: true });
        }
        topBtn.addEventListener("click", () => glideToX(NOW, PERIOD_GLIDE_MS));
        // pinned, like a period step: at the end a pixel is centuries, and the landing can fall a fraction short
        /** The bottom (the oldest point), pinned: there a pixel is centuries. */
        // It lands where the timeline's end meets the bottom strip, so the last event
        // clears the strip (and, on a narrow screen, the button row over it).
        const glideBottom = () => {
            remeasure();
            // measured again on landing (the strip's line can only be read off it once it's
            // stuck), and nudged onto the end if the first guess was off
            glideToX(X0, PERIOD_GLIDE_MS, periods[0], metrics().endScroll, () => {
                remeasure();
                const end = metrics().endScroll;
                if (Math.abs(window.scrollY - end) > 0.5) {
                    window.scrollTo({ top: end, behavior: "instant" });
                    if (pinned) pinned.y = window.scrollY;
                }
            });
        };

        /**
         * Whether x is at the oldest point, within a pixel.
         * @param {number} x
         * @returns {boolean}
         */
        const atOldestPoint = x => toPx(x) >= toPx(X0) - 1;

        botBtn.addEventListener("click", glideBottom);

        /**
         * Where a period starts for the reader: its most recent edge, exactly (the
         * boundary with the next period up); for the newest period, now.
         * @param {number} i The period's index in `periods`.
         * @returns {number} x.
         */
        const periodTop = i => (i === periods.length - 1 ? NOW : periods[i].to);

        /**
         * Glides to the top of the period `step` places on from the current one (from
         * where a running glide is headed, so repeated clicks keep stepping): +1 is the
         * next period down (further back), -1 the previous one up (more recent).
         * @param {1 | -1} step
         */
        function glidePeriod(step) {
            const from = periods.indexOf(glideAim?.p ?? currentPeriod());
            // periods run oldest first, so further back is a lower index; going back up
            // from partway through a period, its own top comes first
            const partway = step < 0 && !glideAim && Math.abs(window.scrollY - scrollYForPeriod(periods[from])) > 1;
            const i = partway ? from : Math.min(periods.length - 1, Math.max(0, from - step));
            if (i === from && !partway) return;
            const top = periodTop(i);
            glideToX(top, PERIOD_GLIDE_MS, periods[i], scrollYForPeriod(periods[i]));
            glideAim = { x: periodTop(i), p: periods[i] };
        }
        nextBtn.addEventListener("click", () => glidePeriod(1));
        prevBtn.addEventListener("click", () => glidePeriod(-1));

        /** Two x within this are the same point (pinned readouts are exact). */
        const SAME_X = 1e-6;

        /**
         * The event `step` places on from x: +1 the next one down (further back), -1
         * the previous one up (more recent); undefined past either end.
         * @param {number} x
         * @param {1 | -1} step
         * @returns {(typeof placed)[number] | undefined}
         */
        function eventFrom(x, step) {
            // placed runs newest first, top to bottom
            return step > 0
                ? placed.find(it => it.x < x - SAME_X)
                : placed.findLast(it => it.x > x + SAME_X);
        }

        /**
         * The event just landed on by an event step, while the page hasn't scrolled since.
         * @type {{ y: number, x: number } | null}
         */
        let landedEvent = null;

        /**
         * Where event steps count from: the event just landed on (it sits below the
         * reading line, so the line's own x would find it again), else the reading point.
         * @returns {number} x.
         */
        function eventBase() {
            if (landedEvent && Math.abs(window.scrollY - landedEvent.y) < 1) return landedEvent.x;
            landedEvent = null;
            return readX();
        }

        /**
         * Glides to the event `step` places on from the current one (or from where a
         * running step is headed), landing with its point on the axis PAD below the
         * period block stuck under the reading line, as the first event sits below the
         * top. The readout shows the line's own year.
         * @param {1 | -1} step
         */
        function glideEvent(step) {
            const ev = eventFrom(glideAim?.x ?? eventBase(), step);
            if (!ev) return;
            const p = periodAt(ev.x);
            const trackTop = track.getBoundingClientRect().top + window.scrollY;
            const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
            // below the period block stuck over it, as the first event sits below the top
            const to = trackTop + ev.y - head.getBoundingClientRect().height - PAD - stuckOver(p);
            glideToX(ev.x, PERIOD_GLIDE_MS, undefined, Math.min(maxScroll, Math.max(0, to)),
                () => { landedEvent = { y: window.scrollY, x: ev.x }; });
            glideAim = { x: ev.x, p };
        }
        nextEvBtn.addEventListener("click", () => glideEvent(1));
        prevEvBtn.addEventListener("click", () => glideEvent(-1));

        // ── Open / collapse ─────────────────────────────────────────────────────

        /** Sets --bht-head-h and --bht-foot-h, for the sticky band labels and progress bar. */
        function measureHead() {
            remeasure();
            // exact heights (offsetHeight rounds, which left a hairline at the frame's corners)
            root.style.setProperty("--bht-head-h", `${head.getBoundingClientRect().height}px`);
            root.style.setProperty("--bht-foot-h", `${foot.getBoundingClientRect().height}px`);
        }

        /** Opens the timeline (building it the first time). */
        function open() {
            if (root.classList.contains("bht-open")) return;
            if (!built) build();
            root.classList.add("bht-open");
            measureHead();
            layout();
            update();
        }

        // ── Keeping it current ──────────────────────────────────────────────────

        window.addEventListener("scroll", queueUpdate, { passive: true });
        let resizeTimer;
        window.addEventListener("resize", () => {
            remeasure();
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                if (!root.classList.contains("bht-open")) return;
                // Phones resize the height as the address bar slides in and out while
                // scrolling: nothing to re-lay out, and moving the page then would yank
                // the reader around. Only a new width rewraps the labels.
                if (window.innerWidth === laidOutWidth) return update();
                laidOutWidth = window.innerWidth;
                // keep the reader's place, if they were in the timeline (above it, leave the page be)
                const before = lastRead;
                measureHead();
                layout();
                if (before?.inside) scrollToX(before.x);
                else update();
            }, 150);
        });
        document.fonts?.ready.then(() => { measureHead(); layout(); update(); });
        // the header's and bottom strip's heights change with their text: keep the
        // sticky band labels and the progress bar between them
        if ("ResizeObserver" in window) {
            const watch = new ResizeObserver(measureHead);
            watch.observe(head);
            watch.observe(foot);
            // anything above the timeline changing size (an image loading) moves it down
            // the page: measure again
            new ResizeObserver(() => { remeasure(); queueUpdate(); }).observe(document.body);
        }

        open();
    })();
</script>
