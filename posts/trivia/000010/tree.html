<style>
    /*
     * The shared part of the Huang / Su family tree, as nested lists: each person's
     * children are a list under them, side by side, so depth is generation and cousins
     * of the same generation sit level. The connecting lines are pure CSS, borders on
     * pseudo-elements: a stem down from each parent that curves out both ways into the
     * sibling bar, a dovetail (the child list's ::before and ::after), then the bar
     * across to each child and the drop into it (the child item's ::before / ::after).
     * The script fills in the people's boxes, plays the intro and highlights a person's line.
     *
     * Colours come from the site's own variables, so the tree follows the theme.
     */
    #hft {
        --hft-gap: 1.25rem;
        /* the site's $border-radius and $border-md (sass/lzon/_config-variables.scss) */
        --hft-radius: 0.3rem;
        --hft-border: max(2px, 0.12rem);
        --hft-line: var(--color-dark);
        --hft-lit: var(--color-primary);
        /* each half of the gap between generations: the stem down from a parent, then the drop into a child */
        --hft-drop: 1.5rem;
        /* rounding of every bend: the stem's dovetail into the bar, and the bar into each child */
        --hft-corner: 10px;
        /* where a line down the middle starts (from either side), and a box reaching just past the middle */
        --hft-mid: calc(50% - var(--hft-border) / 2);
        --hft-half: calc(50% + var(--hft-border) / 2);
        /* hover and picking */
        --hft-quick: .2s ease;
        /* the intro: how far each person drops, and how long each fade takes (the script sets it from TOTAL_MS) */
        --hft-slide: 2em;
        --hft-fade: .8s;

        position: relative;
        /* room above the tree for the intro's slide down (the top box would
           otherwise clip as it starts above the tree's box); the margin gives it back */
        padding-top: var(--hft-slide);
        margin: calc(1.5rem - var(--hft-slide)) auto 1.5rem;
        max-width: 40rem;
    }

    #hft ul {
        position: relative;
        display: flex;
        justify-content: center;
        margin: 0;
        padding: var(--hft-drop) 0 0;
        list-style: none;
    }

    #hft li {
        position: relative;
        flex: 1 1 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        margin: 0;
        padding: var(--hft-drop) calc(var(--hft-gap) / 2) 0;
    }

    /* the common ancestors have no parent above them */
    #hft > ul,
    #hft > ul > li { padding-top: 0; }

    /*
     * The site draws list bullets as a masked li::before (sass/lzon/_base.scss, the
     * caret-right icon): undo all of it here, since these pseudo-elements are the
     * connectors (the mask would hide their borders). The common ancestors get none.
     */
    #hft li::before,
    #hft li::after {
        content: none;
        display: block;
        mask-image: none;
        background-color: transparent;
        margin: 0;
    }

    /* ── connectors ─────────────────────────────────────────────────────────── */

    /* every connector piece: a box with some of its borders drawn */
    #hft ul ul::before,
    #hft ul ul::after,
    #hft ul ul > li::before,
    #hft ul ul > li::after {
        content: "";
        position: absolute;
        top: 0;
        box-sizing: border-box;
        border: 0 solid var(--hft-line);
        transition: border-color var(--hft-quick), opacity var(--hft-quick);
    }

    /*
     * The stem and its dovetail: two boxes meeting at the middle, each drawing the stem
     * (on the side where they meet) and the bar (along the bottom), with a rounded
     * corner between, so the stem curves out into the bar both ways. ::before curves
     * left toward the first child, ::after right toward the last.
     */
    #hft ul ul::before,
    #hft ul ul::after {
        width: calc(var(--hft-corner) + var(--hft-border) / 2);
        height: calc(var(--hft-drop) + var(--hft-border));
        border-bottom-width: var(--hft-border);
    }
    #hft ul ul::before {
        right: var(--hft-mid);
        border-right-width: var(--hft-border);
        border-bottom-right-radius: var(--hft-corner);
    }
    #hft ul ul::after {
        left: var(--hft-mid);
        border-left-width: var(--hft-border);
        border-bottom-left-radius: var(--hft-corner);
    }

    /* over an only child the stem just carries straight on into its drop */
    #hft ul ul:has(> li:only-child)::before {
        height: var(--hft-drop);
        border-bottom-width: 0;
        border-radius: 0;
    }
    #hft ul ul:has(> li:only-child)::after { display: none; }

    /* each child: the bar's left half (::before) and right half with the drop (::after) */
    #hft ul ul > li::before,
    #hft ul ul > li::after {
        width: var(--hft-half);
        height: var(--hft-drop);
        border-top-width: var(--hft-border);
    }
    #hft ul ul > li::before { right: var(--hft-mid); }
    #hft ul ul > li::after {
        left: var(--hft-mid);
        border-left-width: var(--hft-border);
    }

    /*
     * The first child: no bar to its left; its drop turns in from the bar with a rounded
     * corner, and its bar stops short of the middle, where the dovetail's curve takes over
     * (this assumes the middle is its right edge: two children, as every family here has).
     */
    #hft ul ul > li:first-child::before { display: none; }
    #hft ul ul > li:first-child::after {
        width: calc(var(--hft-half) - var(--hft-corner));
        border-top-left-radius: var(--hft-corner);
    }

    /* the last child: likewise mirrored, the drop down the left half's right edge */
    #hft ul ul > li:last-child::after { display: none; }
    #hft ul ul > li:last-child::before {
        left: var(--hft-corner);
        width: auto;
        border-right-width: var(--hft-border);
        border-top-right-radius: var(--hft-corner);
    }

    /* an only child: just a straight drop, carrying on from the stem */
    #hft ul ul > li:only-child::before { display: none; }
    #hft ul ul > li:only-child::after {
        display: block;
        width: var(--hft-half);
        border-top-width: 0;
        border-radius: 0;
    }

    /* ── people ─────────────────────────────────────────────────────────────── */

    .hft-person {
        position: relative;
        z-index: 1;
        display: block;
        width: 100%;
        padding: .75rem .75rem;
        border: var(--hft-border) dashed var(--hft-line);
        border-radius: var(--hft-radius);
        background: transparent;
        color: var(--color-light);
        font: inherit;
        text-align: center;
        line-height: 1.25;
        cursor: pointer;
        transition: border-color var(--hft-quick), opacity var(--hft-quick);
    }
    .hft-person:hover, .hft-person:focus-visible { border-color: var(--hft-lit); outline: none; }

    /* the common ancestors span both lines of descent, but not the full width */
    #hft > ul > li > .hft-person { max-width: 60%; }

    .hft-name { display: flex; flex-wrap: wrap; justify-content: center; column-gap: .3em; font-weight: 600; white-space: nowrap; }
    .hft-role { display: block; font-size: .8em; opacity: .75; }
    .hft-han  { white-space: nowrap; }

    /* the two CEOs: solid outline, so they stand out before anything is picked */
    .hft-ceo {
        border-style: solid;
        /* the site's code block background (sass/lzon/_base.scss, pre) */
        background-color: color-mix(in srgb, var(--color-dark) 25%, transparent);
    }

    /* han chinese chars */ 
  


    /* ── picking: a person's line of descent lights up, everything else fades back ── */

    #hft.hft-picked .hft-person:not(.hft-on) { opacity: .4; }
    .hft-person.hft-on { border-color: var(--hft-lit); }

    #hft.hft-picked :is(ul, li)::before,
    #hft.hft-picked :is(ul, li)::after { opacity: .35; }
    /* a lit child's drop and bar, and the side of the dovetail turning toward it */
    #hft li.hft-on::before,
    #hft li.hft-on::after,
    #hft ul.hft-on-first::before,
    #hft ul.hft-on-last::after { border-color: var(--hft-lit); opacity: 1; }

    /*
     * Intro, like the quote pages (sass/lzon/_component-qotd.scss) but quicker: each
     * person fades in and drops into place with a strong ease-out, one after another;
     * each connector fades in with the person it leads to. The script adds .hft-pre
     * before first paint and takes it off each one in turn. !important: the page
     * column's `.animate-on-hover:hover *` would otherwise swap in its short default
     * while the pointer is over the post.
     */
    #hft.hft-intro .hft-person {
        transition:
            opacity var(--hft-fade) ease,
            transform var(--hft-fade) cubic-bezier(0.16, 1, 0.3, 1),
            border-color var(--hft-quick) !important;
    }
    #hft.hft-intro :is(ul, li)::before,
    #hft.hft-intro :is(ul, li)::after { transition: opacity var(--hft-fade) ease !important; }

    .hft-person.hft-pre { visibility: hidden; opacity: 0; transform: translateY(calc(-1 * var(--hft-slide))); }
    #hft .hft-pre::before,
    #hft .hft-pre::after { opacity: 0 !important; }

    @media (prefers-reduced-motion: reduce) {
        #hft .hft-person,
        #hft :is(ul, li)::before,
        #hft :is(ul, li)::after { transition: none !important; }
    }

    @media (max-width: 640px) {
        #hft { --hft-gap: .75rem; }
        .hft-role { font-size: .75em; }
        #hft > ul > li > .hft-person { max-width: 100%; }
    }
</style>

<!-- Just the shape of the tree: the script puts each person's box in their list item. -->
<div id="hft">
    <ul>
        <!-- generation 1: the shared ancestors -->
        <li data-id="root">
            <ul>
                <!-- generation 2: the two siblings -->
                <li data-id="grandfather">
                    <ul>
                        <!-- generation 3 -->
                        <li data-id="mother-su">
                            <ul>
                                <!-- generation 4 -->
                                <li data-id="lisa"></li>
                            </ul>
                        </li>
                    </ul>
                </li>
                <li data-id="mother-huang">
                    <ul>
                        <!-- generation 3 -->
                        <li data-id="jensen"></li>
                    </ul>
                </li>
            </ul>
        </li>
    </ul>
</div>

<script>
    (() => {
        "use strict";

        // ── The text on each person's box ───────────────────────────────────────
        // Edit here. Keyed by each list item's data-id in the markup above; `name` is
        // the bold line, `role` the smaller line under it (plain text, no HTML), and
        // `ceo` gives the box a solid outline.
        const PEOPLE = {
            "root":         { name: "Lo Chü",       han:"羅取", role: "Grandfather, Great-Grandfather b. [unknown]" },
            "grandfather":  { name: "Lo Po-mu",     han:"羅伯沐", role: "Su's Grandfather b. 1921" },
            "mother-huang": { name: "Lo Tsai-hsiu", han:"羅采秀", role: "Huang's Mother b. 1939" },
            "mother-su":    { name: "Lo Shu-ya",    han:"羅淑雅", role: "Su's Mother b. 1944" },
            "jensen":       { name: "Jensen Huang", han:"黃仁勳", role: "Co-founder, NVIDIA b. 1963",    ceo: true },
            "lisa":         { name: "Lisa Su",      han:"蘇姿丰", role: "Chair & CEO, AMD b. 1969",      ceo: true },
        };

        const root  = document.getElementById("hft");
        const items = [...root.querySelectorAll("li[data-id]")];
        const byId  = new Map(items.map(li => [li.dataset.id, li]));

        /**
         * Makes a person's box: a button with their name over their role.
         * @param {{name: string, role: string, ceo?: boolean}} text What the box says.
         * @returns {HTMLButtonElement}
         */
       function makePerson({ name, han, role, ceo }) {
            const button = document.createElement("button");
            button.type = "button";
            button.className = ceo ? "hft-person hft-ceo" : "hft-person";

            const nameEl = document.createElement("span");
            nameEl.className = "hft-name";
            nameEl.append(name);
            if (han) {
                const hanEl = document.createElement("span");
                hanEl.className = "hft-han";
                hanEl.textContent = `${han}`;
                nameEl.append(hanEl);
            }

            const roleEl = document.createElement("span");
            roleEl.className = "hft-role";
            roleEl.textContent = role;

            button.append(nameEl, roleEl);
            return button;
        }

        /** Each list item's box, put in first so it sits above the item's children (before first paint: this script runs right after the markup). */
        const personOf = new Map(items.map(li => {
            const button = makePerson(PEOPLE[li.dataset.id] ?? { name: li.dataset.id, role: "" });
            li.prepend(button);
            return [li, button];
        }));

        /**
         * A person's line up to the common ancestors, themselves first.
         * @param {HTMLLIElement} li The person's list item.
         * @returns {HTMLLIElement[]}
         */
        function lineage(li) {
            const line = [];
            for (let it = li; it; it = it.parentElement.closest("li[data-id]")) line.push(it);
            return line;
        }

        /** The picked person's id, or null for the default view. */
        let picked = null;

        /**
         * Lights up `id`'s line of descent (or nothing, for null). A lit item lights its
         * own connector, and the list it sits in lights the side of its dovetail that
         * turns toward it (an only child counts as first: a straight stem); the common
         * ancestors have neither.
         * @param {string | null} id The person to light up.
         */
        function highlight(id) {
            const on = new Set(id ? lineage(byId.get(id)) : []);
            root.classList.toggle("hft-picked", !!id);
            for (const li of items) {
                const lit = on.has(li) && li.dataset.id !== "root";
                const first = li === li.parentElement.firstElementChild;
                li.classList.toggle("hft-on", lit);
                li.parentElement.classList.toggle(first ? "hft-on-first" : "hft-on-last", lit);
                personOf.get(li).classList.toggle("hft-on", on.has(li));
                personOf.get(li).setAttribute("aria-pressed", String(li.dataset.id === id));
            }
        }

        // Click: pick someone, or clicking them again clears it; clicking anywhere else
        // on the page (the tree's empty space included) clears it too.
        document.addEventListener("click", e => {
            const li = root.contains(e.target) ? e.target.closest(".hft-person")?.parentElement : null;
            const next = li && picked !== li.dataset.id ? li.dataset.id : null;
            if (next === picked) return;  // a click away with nothing picked: nothing to do
            picked = next;
            highlight(picked);
        });

        highlight(null);  // nobody picked: every button starts unpressed

        // ── Intro ────────────────────────────────────────────────────────────────

        /** The whole intro, from the first person starting to the last one settling. Tune this. */
        const TOTAL_MS = 1500;

        /** The stagger as a fraction of the fade: 0.3 = the next person starts 30% into the last one's fade. */
        const OVERLAP = 0.3;

        /**
         * How long each fade and slide takes. The total is the last start, (n - 1) staggers,
         * plus one fade: TOTAL_MS = FADE_MS * (1 + (n - 1) * OVERLAP).
         */
        const FADE_MS = TOTAL_MS / (1 + (items.length - 1) * OVERLAP);

        /** Delay between one person starting and the next. */
        const STAGGER_MS = FADE_MS * OVERLAP;

        /**
         * What .hft-pre hides for one person: their box, the connector into them, and
         * the stem above their list.
         * @param {HTMLLIElement} li The person's list item.
         * @returns {HTMLElement[]}
         */
        const introParts = li => [personOf.get(li), li, li.parentElement];

        /** People in generation order (document order would show a whole branch before the other). */
        const byGeneration = [...items].sort((a, b) => lineage(a).length - lineage(b).length);

        /** Plays the intro: people in generation order, one after another. */
        function playIntro() {
            root.style.setProperty("--hft-fade", `${FADE_MS}ms`);
            root.classList.add("hft-intro");
            byGeneration.forEach((li, i) => setTimeout(() => {
                for (const el of introParts(li)) el.classList.remove("hft-pre");
            }, i * STAGGER_MS));
            // back to the short transitions for picking once everything has settled
            setTimeout(() => root.classList.remove("hft-intro"), TOTAL_MS);
        }

        // Hidden before first paint (this script runs right after the markup); without
        // motion, or without IntersectionObserver, everything just shows.
        const motion = !window.matchMedia("(prefers-reduced-motion: reduce)").matches && "IntersectionObserver" in window;
        if (motion) {
            for (const li of items) for (const el of introParts(li)) el.classList.add("hft-pre");

            // The intro plays once the tree is on screen, and the page's fonts are ready.
            const seen = new IntersectionObserver(entries => {
                if (!entries.some(e => e.isIntersecting)) return;
                seen.disconnect();
                document.fonts.ready.then(() => requestAnimationFrame(playIntro));
            }, { threshold: 0.3 });
            seen.observe(root);
        }
    })();
</script>
