<div class="border rounded mb-md mx-auto w-100 w-md-80 w-sm-75">
    <!-- preload=metadata, not auto: the file is 4 MB, and all the browser
         needs before play is the duration for its own readout. -->
    <audio
        controls
        loop
        preload="metadata"
        src="hobbits.mp3"
        title="Concerning Hobbits — Howard Shore"
        style="width: 100%; display: block;">
        Your browser can't play audio.
        <a href="hobbits.mp3">Download Concerning Hobbits</a> instead.
    </audio>
    <script>
        document.currentScript.previousElementSibling.volume = 0.5;
    </script>

    <div class="text-sm text-mute lh-sm p-sm">
        I recommend playing this while reading my post, enjoy!
    </div>
</div>
