<script>
    /**
     * Parses a YYYY-MM-DD string as a date in the viewer's local timezone.
     * `new Date(str)` reads that format as UTC midnight, which renders as the
     * previous day for anyone west of Greenwich, so the parts are split out.
     * @param {string} str - Date in YYYY-MM-DD form.
     * @returns {Date|null} The parsed date, or null if the string is malformed.
     */
    function parseLocalDate(str) { 
        const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(str.trim()); 
        if (!m) return null; 

        const year = Number(m[1]), month = Number(m[2]) - 1, day = Number(m[3]); 
        const date = new Date(year, month, day); 

        // Out-of-range parts roll over silently -- month 13 becomes January of
        // the next year -- so confirm the date still holds what was asked for.
        const isExact = date.getFullYear() === year 
            && date.getMonth() === month 
            && date.getDate() === day; 

        return isExact ? date : null; 
    }

    /**
     * Collapses runs of whitespace to single spaces and trims the ends, so a
     * data-desc wrapped across several lines in the markup still reads as one
     * line on the page. innerText honours newlines, so without this the breaks
     * in the attribute would show up verbatim.
     * @param {string} str - The raw attribute value.
     * @returns {string} The value as a single line.
     */
    function collapseWhitespace(str) { 
        return str.replace(/\s+/g, " ").trim(); 
    }

    /**
     * Formats a date the way the site writes them out, e.g. "March 9, 2020".
     * The locale is pinned so the wording does not shift with the viewer's.
     * @param {Date} date - The date to format.
     * @returns {string} The formatted date.
     */
    function formatLongDate(date) { 
        return date.toLocaleDateString("en-US", { 
            year: "numeric", 
            month: "long", 
            day: "numeric" 
        }); 
    }

    /**
     * Whole years and days between two dates, as one breakdown: the days are
     * what remains after the whole years, so they run 0-365 rather than being
     * a total of the entire span.
     * @param {Date} from - The earlier date.
     * @param {Date} to - The later date.
     * @returns {{years: number, days: number}}
     */
    function elapsedSince(from, to) { 
        const MS_PER_DAY = 86400000; 
        const atMidnight = (d) => Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()); 

        let years = to.getFullYear() - from.getFullYear(); 
        const anniversary = new Date(from.getFullYear() + years, from.getMonth(), from.getDate()); 

        // This year's anniversary may not have arrived yet; if so, back up one.
        if (atMidnight(anniversary) > atMidnight(to)) { 
            years -= 1; 
            anniversary.setFullYear(anniversary.getFullYear() - 1); 
        }

        // Differencing UTC midnights keeps daylight-saving shifts out of the
        // day count, which a plain millisecond subtraction would pick up.
        const days = Math.round((atMidnight(to) - atMidnight(anniversary)) / MS_PER_DAY); 

        return { years, days }; 
    }

    /**
     * Cross-fades text: fades elements out, swaps their content, fades them
     * back. Several elements fade as one group so a card's parts never fall out
     * of step with each other.
     */
    class TextFader { 
        /**
         * Length of each half of the fade, in milliseconds. Must match the
         * opacity transition on #p-y100-desc / #s-y100-date in the stylesheet
         * below -- the swap happens when the fade-out is done.
         */
        static FADE_MS = 200; 

        constructor() { 
            this.timer = null; 
        }

        /**
         * Fades the given elements out, writes their new text, and fades them
         * back in. A swap already in flight is cancelled first, so clicking
         * quickly between buttons cannot leave a stale timer writing old text.
         * @param {Array<[HTMLElement, string]>} parts - Element/text pairs.
         */
        swap(parts) { 
            if (this.timer !== null) clearTimeout(this.timer); 

            parts.forEach(([el]) => { el.style.opacity = "0"; }); 

            this.timer = setTimeout(() => { 
                parts.forEach(([el, text]) => { 
                    el.innerText = text; 
                    el.style.opacity = "1"; 
                }); 

                this.timer = null; 
            }, TextFader.FADE_MS); 
        }
    }

    /**
     * Drives an element's text with a whole number that eases toward its target.
     */
    class CountUp { 
        /**
         * @param {string} elId - Id of the element whose text is driven.
         * @param {string} unit - Singular unit name, e.g. "year".
         */
        constructor(elId, unit) { 
            this.el = document.getElementById(elId); 
            this.unit = unit; 
            this.value = 0; 
            this.frame = null; 
        }

        /**
         * Eases from the current value to `target`. Any tween still running is
         * cancelled first, so clicking through buttons quickly cannot leave two
         * tweens writing to the same element.
         * @param {number} target - Value to land on.
         * @param {number} [duration=1500] - Tween length in milliseconds.
         */
        animateTo(target, duration = 1500) { 
            if (!this.el) return; 
            if (this.frame !== null) cancelAnimationFrame(this.frame); 

            const from = this.value; 
            const delta = target - from; 

            if (delta === 0) { 
                this.draw(target); 
                return; 
            }

            const start = performance.now(); 

            const step = (now) => { 
                const t = Math.min((now - start) / duration, 1); 
                const eased = 1 - Math.pow(1 - t, 3); // easeOutCubic

                this.value = from + delta * eased; 
                this.draw(Math.round(this.value)); 

                if (t < 1) { 
                    this.frame = requestAnimationFrame(step); 
                } else { 
                    this.value = target; 
                    this.frame = null; 
                }
            };

            this.frame = requestAnimationFrame(step); 
        }

        /**
         * Writes one whole-number value, pluralising the unit to match.
         * @param {number} n - The value to show.
         */
        draw(n) { 
            this.el.innerText = `${n} ${this.unit}${n === 1 ? "" : "s"}`; 
        }
    }

    class VisGrid { 
        /**
         * Seconds for the reveal to sweep the whole grid, end to end. Divided
         * by the cell count below, so the sweep takes the same time whatever
         * the grid's dimensions. Raise it to make the year order more legible,
         * lower it to make the reveal snappier.
         */
        static STAGGER_SWEEP_S = 1.5; 

        constructor(el) { 
            this.el = el; 
            this.elGridButtons = [] 
            this.fader = new TextFader(); 
        }

        replaceGrid(gv) { 
            const grid = document.createElement("div"); 
            grid.classList.add(
                "grid-container",
                "gap-sm"
            ); 

            // Headers live inside the cell grid, as the first cell of each
            // row, so they share the cells' row tracks and stay aligned with
            // them however the rows are sized.
            const hasHeaders = Boolean(gv.getRowText); 
            if (hasHeaders) grid.classList.add("has-headers"); 

            /**
             * When a cell appears in the reveal, as a CSS delay. Where a cell
             * sits is the view's call, since only it knows which cells carry
             * meaning; the fallback spreads every cell evenly in row-major
             * order, the same order getCellOffset walks.
             * @param {number} col - Column index (0-based).
             * @param {number} row - Row index (0-based).
             * @returns {string} The animation-delay value.
             */
            const delayFor = (col, row) => { 
                const fraction = gv.getCellDelayFraction 
                    ? gv.getCellDelayFraction(col, row) 
                    : ( row * gv.width + col ) / ( gv.width * gv.height - 1 ); 

                return `${fraction * VisGrid.STAGGER_SWEEP_S}s`; 
            };

            for (let i = 0; i < gv.height; ++i) { 
                if (hasHeaders) { 
                    const hdr = document.createElement("div"); 
                    hdr.innerText = gv.getRowText(i); 
                    hdr.classList.add(
                        "row-header", 
                        "text-sans-serif", 
                        "text-sm"
                    ); 

                    hdr.style.animationDelay = delayFor(0, i); 

                    grid.appendChild(hdr); 
                }

                for (let j = 0; j < gv.width; ++j) { 
                    const cell = document.createElement("div"); 
                    cell.classList.add(
                        gv.getCellClass(j, i), 
                        "text-sans-serif", 
                        "text-sm", 
                        "border", 
                        "border-dashed",
                        "rounded", 
                    ); 
                    
                    cell.style.animationDelay = delayFor(j, i); 
                    cell.innerText = gv.getCellText ? gv.getCellText(j, i) : ""; 
                    
                    grid.appendChild(cell); 
                }
            }

            this.el.replaceChildren(); 
            this.el.style = `--grid-width:${gv.width}; --grid-height:${gv.height};`; 
            this.el.appendChild(grid); 
            
        }    

        /**
         * Binds every button matching `selector`. Each carries its own data-date
         * and data-desc, so there is nothing to wire up per button; the first
         * match is the one selected on load.
         * @param {string} selector - CSS selector matching the buttons.
         * @param {object} gv - The grid view the buttons drive.
         */
        bindGridButtons(selector, gv) { 
            const btns = document.querySelectorAll(selector); 
            if (!btns.length) { 
                console.error(`No grid buttons matched "${selector}"`); 
                return; 
            }

            btns.forEach((btn, i) => this.bindGridButton(btn, gv, i === 0)); 
        }

        /**
         * Binds one button, taking the moment it represents from its own
         * data attributes.
         * @param {HTMLElement} btn - The button element.
         * @param {object} gv - The grid view the button drives.
         * @param {boolean} isDefault - Whether to select it immediately.
         */
        bindGridButton(btn, gv, isDefault) { 
            // The button's data-date attribute is the one place the moment
            // being measured is written down; both the year grid and the
            // elapsed readout are derived from it.
            const startDate = btn.dataset.date ? parseLocalDate(btn.dataset.date) : null; 
            if (btn.dataset.date && !startDate) { 
                console.error(`Grid button "${collapseWhitespace(btn.textContent)}" has an unparseable data-date: "${btn.dataset.date}"`); 
            }

            this.elGridButtons.push(btn); 

            const onClick = () => { 
                // Re-picking the current moment changes nothing, so replaying
                // the reveal and the counters would just be noise.
                if (btn.classList.contains("active")) return; 

                if (startDate) { 
                    gv.startDate = startDate; 

                    // The grid counts calendar years touched, so that its first
                    // cell is labelled with the year the event happened.
                    gv.years = ( new Date().getFullYear() ) - startDate.getFullYear(); 
                }

                gv.desc = collapseWhitespace(btn.dataset.desc ?? ""); 

                this.replaceGrid(gv); 

                this.elGridButtons.forEach(el => {
                    el.classList.remove("active"); 
                });

                btn.classList.add("active"); 

                // The date stays derived from data-date rather than being
                // written into data-desc, and now lands in the card's metadata
                // row beside the calendar icon.
                // The card sits above the buttons, so a shorter description
                // would pull the button row up under the cursor mid-click.
                // Pinning the box to its current height before swapping the
                // text lets it grow but never shrink. box-sizing is border-box
                // site-wide, so offsetHeight and min-height are the same box.
                const pDesc = document.getElementById("p-y100-desc"); 
                pDesc.style.minHeight = `${pDesc.offsetHeight}px`; 

                const elDate = document.getElementById("s-y100-date"); 

                // Both halves of the card fade as one group: a hard cut on the
                // date while the description faded would read as a glitch.
                this.fader.swap([
                    [pDesc, gv.desc], 
                    [elDate, startDate ? formatLongDate(startDate) : ""], 
                ]); 

                if (gv.onSelect) gv.onSelect(gv); 
            };

            if (isDefault) onClick(); 
            btn.addEventListener("click", onClick); 
        }
    }
</script>

<script>
    const vgY100 = new VisGrid(
        document.querySelector("#grid-y100")
    );

    const gvY100 = {
        width: 10, 

        /**
         * Most decades the grid will ever draw -- the hundred years the page is
         * named for, and the length of the ordinal list getRowText indexes.
         */
        maxRows: 10, 

        years: 32,
        startYear: 0,
        desc: "", 

        /**
         * Rows the grid needs: enough decades to hold the elapsed span, with
         * the last one filled out to ten so it still reads as a whole decade.
         * A getter, so VisGrid picks up the new size on its next read without
         * anything having to remember to recalculate it.
         * @returns {number} Row count, at least one and never past maxRows.
         */
        get height() { 
            const rows = Math.ceil(( gvY100.years + 1 ) / gvY100.width); 
            return Math.min(gvY100.maxRows, Math.max(1, rows)); 
        },

        /**
         * Heading shown beside a decade row.
         * @param {number} i - Row index (0-based).
         * @returns {string} Ordinal naming the decade, e.g. "1st".
         */
        getRowText: (i) => { 
            return [
                "1st", "2nd", "3rd", "4th", "5th", "6th", "7th", "8th", "9th", "10th"
            ][i]; 
        },

        /**
         * Position of a cell in the 100-year sequence. Time runs across each
         * decade row before dropping to the next, so the index is row-major:
         * row * width + column.
         * @param {number} i - Column index (0-based).
         * @param {number} j - Row index (0-based).
         * @returns {number} Offset from the start of the span, in years.
         */
        getCellOffset: (i, j) => j*gvY100.width + i,

        /**
         * Picks the class for a cell: elapsed, still to come, or the current
         * year -- which is the last elapsed cell, at offset `years`.
         * @param {number} i - Column index (0-based).
         * @param {number} j - Row index (0-based).
         * @returns {string} CSS class describing the cell's state.
         */
        getCellClass: (i, j) => { 
            const offset = gvY100.getCellOffset(i, j); 

            if (offset === gvY100.years) return "grid-item-now"; 
            return offset < gvY100.years+1 ? "grid-item-on" : "grid-item-off"; 
        },

        /**
         * Calendar year shown inside a cell.
         * @param {number} i - Column index (0-based).
         * @param {number} j - Row index (0-based).
         * @returns {string} The four-digit year for that cell.
         */
        getCellText: (i, j) => { 
            const nowYear = new Date().getFullYear(); 
            const yearDist = gvY100.years + 1
            const yearOffset = gvY100.getCellOffset(i, j); 
            const yearString = `${nowYear-yearDist+yearOffset+1}`;
            return yearString;  
        }
    };  



    const cuYears = new CountUp("s-y100-years", "year"); 
    const cuDays  = new CountUp("s-y100-days",  "day"); 

    /**
     * Eases the three readout spans to the time elapsed since the selected
     * moment, using the same date the grid was built from.
     * @param {object} gv - The grid view, carrying the selected startDate.
     */
    gvY100.onSelect = (gv) => { 
        if (!gv.startDate) return; 

        const elapsed = elapsedSince(gv.startDate, new Date()); 

        cuYears.animateTo(elapsed.years); 
        cuDays.animateTo(elapsed.days); 
    };

    vgY100.bindGridButtons("#y100-buttons .btn", gvY100); 


</script>

<style>
    .gcontainer {
        --grid-width: 10; 
        --grid-height: 10; 

        width: 100%;
        overflow-x: auto;
    }
    
    .grid-container {
        display: grid;
        /* minmax(0, ...) rather than a bare 1fr: a plain 1fr track floors at
           min-content, so ten "2020" labels would force the grid wider than a
           phone screen and hand the container a scrollbar. */
        grid-template-columns: repeat(var(--grid-width), minmax(0, 1fr));
        /* auto rows, not 1fr: an fr row hands each cell a definite height, and
           aspect-ratio would then derive the cell's WIDTH from that, shrinking
           the tiles away from their tracks. With auto rows the width comes from
           the track and the square height follows from the width. */
        grid-template-rows: repeat(var(--grid-height), auto);
    }

    /* Adds the leading column the row headers sit in. */
    .grid-container.has-headers {
        grid-template-columns: auto repeat(var(--grid-width), minmax(0, 1fr));
    }

    /*
     * Two lines of room. The date has its own row now, so only the description
     * varies, and reserving its longest case stops the grid below from shifting
     * as the selection changes.
     */
    #p-y100-desc {
        min-height: 3em;  /* fallback for browsers without the lh unit */
        min-height: 2lh;
    }

    /* The cross-fade TextFader drives. Keep in step with TextFader.FADE_MS. */
    #p-y100-desc,
    #s-y100-date {
        transition: opacity 200ms ease;
    }

    /* Equal-width digits, so the headline does not reflow as it counts. */
    .elapsed-readout {
        font-variant-numeric: tabular-nums;

        /* Narrow screens break the line between spans, never inside one. */
        flex-wrap: wrap;
    }

    .elapsed-readout span {
        white-space: nowrap;
    }

    .row-header {
        display: flex;
        justify-content: flex-end;  /* labels hug the grid they annotate */
        align-items: center;

        /* Rides in with the first cell of its row. */
        animation: scaleIn .25s ease-out forwards;
        transform: scale(0);
        opacity: 0;

        white-space: nowrap;
        color: var(--color-gray);
    }

    /*
     * Ten columns of 2px dashed border eats a real share of a phone screen, so
     * the tiles drop to a hairline below the md breakpoint (768px). The
     * !important is not optional here: the .border helper the cells are given
     * declares its own width as !important, and would otherwise win.
     */
    @media (max-width: 768px) {
        /* Puts the trailing phrase on a line of its own, rather than leaving it
           to whether the two counts happen to fill the row. A full-width basis
           in a wrapping flex row always starts a new line. */
        .elapsed-readout .readout-tail {
            flex-basis: 100%;
        }

        .grid-item-on,
        .grid-item-now,
        .grid-item-off {
            border-width: 1px !important;

            /* Ten four-digit years will not fit legibly across a phone, so the
               grid reads as a density plot instead. !important is needed to
               beat the .text-sm helper's own !important font-size. */
            font-size: 0 !important;
        }
    }

    @keyframes scaleIn {
        from {
            transform: scale(0);
            opacity: 0;
        }
        to {
            transform: scale(1);
            opacity: 1;
        }
    }

    .grid-item-on,
    .grid-item-now {
        /* width:100% makes the inline size definite, so aspect-ratio has
           something to derive the square's height FROM. Left as auto the box
           has no intrinsic size to stretch from and collapses. */
        width: 100%;
        aspect-ratio: 1 / 1;

        background: var(--color-primary-dark);
        border-color: var(--color-primary);
        
        /* Animation properties */
        animation: scaleIn .25s ease-out forwards;
        transform: scale(0);
        opacity: 0;

        overflow: hidden;

        /* Flexbox centering */
        display: flex;
        justify-content: center;  /* horizontal center */
        align-items: center;      /* vertical center */
    }

    /* The year we are standing in, picked out from the rest of the elapsed
       span. Follows .grid-item-on above, so it inherits every lit style and
       only restates the two colours. */
    .grid-item-now {
        background: var(--color-tertiary-dark);
        border-color: var(--color-tertiary);
    }

    .grid-item-off {
        width: 100%;
        aspect-ratio: 1 / 1;

        /* Animation properties */
        animation: scaleIn .25s ease-out forwards;
        transform: scale(0);
        opacity: 0;

        overflow: hidden;

        color: var(--color-gray); 

        /* Flexbox centering */
        display: flex;
        justify-content: center;  /* horizontal center */
        align-items: center;      /* vertical center */
    }
</style>
