<style>
    /*
     * Single source of truth for the ring's look and motion. The sketch reads
     * these back with getComputedStyle at start-up, so the numbers live here
     * rather than being duplicated in the script below.
     */
    #ring-stage {
        --ring-height: 420px;

        /*
         * The motion, composed as quaternions: the ring's axis leans off the
         * view direction and sweeps a cone around it (precession), while the
         * cone's own axis nods slowly. A torus is rotationally symmetric
         * about its own axis, so spinning it there would be invisible — what
         * reads as motion is the ellipse turning and opening. Periods that
         * don't divide evenly into one another keep it off a short repeat.
         */
        --ring-precess-period: 9;
        --ring-nod-period: 14;

        /*
         * Cone half angle, in degrees, and the amplitude of the nod. Together
         * they decide how open the ellipse gets: at 45 and 20 the ring's axis
         * stays between 25 and 65 degrees off the view direction, so the band
         * never collapses to a line or flattens to a plain circle.
         */
        --ring-lean: 45;
        --ring-nod: 20;

        /* Gold, as sRGB triples the sketch feeds to p5 directly. */
        --ring-gold: 198 154 62;
        --ring-gold-lit: 255 226 150;

        position: relative;
        width: 100%;
        height: var(--ring-height);

        /* The canvas is sized from this box, so it must not be able to grow
           the box back: an inline canvas would add a descender gap and start
           a resize feedback loop on narrow screens. */
        overflow: hidden;

        /* Deliberately no background: the canvas is drawn with clear(), so the
           post's own background shows through in either theme. */
    }

    #ring-stage canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: transparent;
    }

    /* Shown only if WEBGL or p5 never comes up; the sketch removes it. */
    #ring-fallback {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        opacity: .6;
        font-style: italic;
    }

    @media (max-width: 640px) {
        #ring-stage {
            --ring-height: 280px;
        }
    }
</style>

<div id="ring-stage" role="img" aria-label="A gold ring turning slowly in three dimensions.">
    <div id="ring-fallback">One Ring, not rendered.</div>
</div>

<script>
    (() => {
        "use strict";

        const STAGE_ID = "ring-stage";
        const P5_SRC = "/js/p5.js";

        /**
         * Reads one custom property off an element and coerces it to a number.
         *
         * @param {CSSStyleDeclaration} style - Resolved style for the stage.
         * @param {string} name - Custom property name, including the leading dashes.
         * @param {number} fallback - Value used when the property is absent or unparseable.
         * @returns {number} The parsed number, or `fallback`.
         */
        function readNumber(style, name, fallback) {
            const parsed = parseFloat(style.getPropertyValue(name));
            return Number.isFinite(parsed) ? parsed : fallback;
        }

        /**
         * Reads a custom property holding a space-separated RGB triple.
         *
         * @param {CSSStyleDeclaration} style - Resolved style for the stage.
         * @param {string} name - Custom property name, including the leading dashes.
         * @param {number[]} fallback - Value used when the property is absent.
         * @returns {number[]} Three channel values in the 0-255 range.
         */
        function readColor(style, name, fallback) {
            const parts = style.getPropertyValue(name).trim().split(/[\s,]+/).map(Number);
            return parts.length === 3 && parts.every(Number.isFinite) ? parts : fallback;
        }

        /**
         * Loads p5 once per page and resolves when the global is available.
         *
         * The marker attribute is deliberately generic: every sketch on the
         * page must look for the SAME one. Two sketches with two different
         * markers each add their own tag, the bundle is evaluated twice, and
         * the second pass clobbers the first's module state — which shows up
         * as "Cannot set properties of undefined (setting 'presetup')" and a
         * sketch that never draws.
         *
         * @returns {Promise<void>} Resolves on load, rejects if the script fails.
         */
        function loadP5() {
            if (window.p5) return Promise.resolve();

            let tag = document.querySelector("script[data-p5-loader]");
            if (!tag) {
                tag = document.createElement("script");
                tag.src = P5_SRC;
                tag.async = true;
                tag.setAttribute("data-p5-loader", "");
                document.head.appendChild(tag);
            }

            return new Promise((resolve, reject) => {
                tag.addEventListener("load", () => resolve(), { once: true });
                tag.addEventListener("error", () => reject(new Error("p5 failed to load")), { once: true });
            });
        }

        /**
         * A unit quaternion for a rotation about an axis.
         *
         * @param {number} x - Axis x component; the axis is assumed unit length.
         * @param {number} y - Axis y component.
         * @param {number} z - Axis z component.
         * @param {number} angle - Rotation about that axis, in radians.
         * @returns {number[]} The quaternion as `[w, x, y, z]`.
         */
        function quatAxisAngle(x, y, z, angle) {
            const half = angle / 2;
            const s = Math.sin(half);
            return [Math.cos(half), x * s, y * s, z * s];
        }

        /**
         * Hamilton product of two quaternions. `quatMul(a, b)` is the rotation
         * that applies `b` first and then `a`, matching how the nested
         * rotations below read from the inside out.
         *
         * @param {number[]} a - Left quaternion as `[w, x, y, z]`.
         * @param {number[]} b - Right quaternion as `[w, x, y, z]`.
         * @returns {number[]} The composed quaternion as `[w, x, y, z]`.
         */
        function quatMul(a, b) {
            const [aw, ax, ay, az] = a;
            const [bw, bx, by, bz] = b;
            return [
                aw * bw - ax * bx - ay * by - az * bz,
                aw * bx + ax * bw + ay * bz - az * by,
                aw * by - ax * bz + ay * bw + az * bx,
                aw * bz + ax * by - ay * bx + az * bw,
            ];
        }

        /**
         * Converts a quaternion to a 4x4 model matrix in the column-major
         * order p5's `applyMatrix` expects in WEBGL mode.
         *
         * The quaternion is normalised on the way in. Products of unit
         * quaternions stay near unit length, but the drift over an hour of
         * frames would show up as the ring quietly scaling, and normalising
         * is cheaper than reasoning about how long that takes.
         *
         * @param {number[]} q - Quaternion as `[w, x, y, z]`.
         * @returns {number[]} Sixteen matrix entries, column-major.
         */
        function quatToMatrix(q) {
            const len = Math.hypot(q[0], q[1], q[2], q[3]) || 1;
            const w = q[0] / len;
            const x = q[1] / len;
            const y = q[2] / len;
            const z = q[3] / len;

            const xx = x * x, yy = y * y, zz = z * z;
            const xy = x * y, xz = x * z, yz = y * z;
            const wx = w * x, wy = w * y, wz = w * z;

            return [
                1 - 2 * (yy + zz), 2 * (xy + wz), 2 * (xz - wy), 0,
                2 * (xy - wz), 1 - 2 * (xx + zz), 2 * (yz + wx), 0,
                2 * (xz + wy), 2 * (yz - wx), 1 - 2 * (xx + yy), 0,
                0, 0, 0, 1,
            ];
        }

        /**
         * Builds the p5 instance-mode sketch for the rotating ring.
         *
         * @param {HTMLElement} stage - Container the canvas is sized from and parented to.
         * @param {object} config - Values lifted from the stage's custom properties.
         * @param {number} config.precessPeriod - Seconds per full sweep of the cone.
         * @param {number} config.nodPeriod - Seconds per full nod of the cone's axis.
         * @param {number} config.lean - Half angle of the cone, in degrees.
         * @param {number} config.nod - Amplitude of the nod, in degrees.
         * @param {number[]} config.gold - Base metal colour.
         * @param {number[]} config.goldLit - Highlight colour, used for the lights too.
         * @param {boolean} config.reducedMotion - When true the ring holds still.
         * @returns {(p: object) => void} A sketch function for `new p5(...)`.
         */
        function makeSketch(stage, config) {
            return (p) => {
                // Both are derived from the canvas size so the ring keeps its
                // proportions when the column width changes.
                let radius = 0;
                let tube = 0;

                /** Recomputes the ring's dimensions from the current canvas size. */
                const fit = () => {
                    const span = Math.min(p.width, p.height);
                    radius = span * 0.30;
                    tube = radius * 0.22;
                };

                p.setup = () => {
                    const canvas = p.createCanvas(stage.clientWidth, stage.clientHeight, p.WEBGL);
                    canvas.parent(stage);
                    p.pixelDensity(Math.min(window.devicePixelRatio || 1, 2));
                    p.noStroke();
                    fit();
                    // No describe() here: it looks the canvas up by id, and
                    // every p5 instance numbers its canvas defaultCanvas0, so
                    // with a second sketch on the page it finds the wrong node
                    // and throws. The stage carries the label instead.
                };

                p.windowResized = () => {
                    p.resizeCanvas(stage.clientWidth, stage.clientHeight);
                    fit();
                };

                p.draw = () => {
                    // clear(), not background(): this is what keeps the canvas
                    // transparent, so the ring sits on the post's own
                    // background and nothing here needs to know which one.
                    p.clear();

                    // The angles come from the clock rather than a frame
                    // counter, so the speed holds on displays that skip or
                    // double frames, and so pausing resumes in the right place.
                    const seconds = config.reducedMotion ? 2 : p.millis() / 1000;
                    const precess = (seconds / config.precessPeriod) * p.TWO_PI;
                    // The nod oscillates rather than turning: a full turn here
                    // would carry the ring through edge-on, where it reads as
                    // a bare line. Bounded, it only varies how open it looks.
                    const nod = p.radians(config.nod) *
                        Math.sin((seconds / config.nodPeriod) * p.TWO_PI);

                    // Orientation as one quaternion, read inside out: lean the
                    // torus off the view direction by the cone's half angle,
                    // sweep that lean around the view axis, then nod the cone
                    // itself. Composing rotations this way has no gimbal to
                    // lock — there is no Euler triple for an axis to collapse
                    // onto, so the motion stays even through every pose.
                    const orientation = quatMul(
                        quatMul(
                            quatAxisAngle(0, 1, 0, nod),
                            quatAxisAngle(0, 0, 1, precess)
                        ),
                        quatAxisAngle(1, 0, 0, p.radians(config.lean))
                    );

                    // A key light off the upper left plus a dim ambient fill.
                    // The highlight travelling along the band is what sells it
                    // as metal, so the lights stay fixed while the ring turns.
                    p.ambientLight(38, 34, 28);
                    p.directionalLight(...config.goldLit, -0.4, -0.6, -0.7);
                    p.pointLight(...config.goldLit, 0, -260, 320);

                    p.push();
                    p.applyMatrix(...quatToMatrix(orientation));
                    // fill() is the diffuse colour; ambientMaterial only
                    // answers ambientLight, so both are needed here.
                    p.fill(...config.gold);
                    p.ambientMaterial(...config.gold);
                    p.specularMaterial(...config.goldLit);
                    p.shininess(60);
                    p.torus(radius, tube, 96, 32);
                    p.pop();
                };
            };
        }

        /**
         * Loads p5, starts the sketch, and keeps it from drawing while the
         * ring is scrolled off screen.
         *
         * @param {HTMLElement} stage - The ring's container.
         * @param {object} config - Sketch configuration, as built in `start`.
         * @returns {Promise<void>} Resolves once the sketch is running.
         */
        async function run(stage, config) {
            await loadP5();

            const fallback = document.getElementById("ring-fallback");
            if (fallback) fallback.remove();

            const sketch = new window.p5(makeSketch(stage, config));

            // Off-screen frames are wasted GPU work on a long post, and the
            // clock-driven angle means the ring resumes where it should.
            if ("IntersectionObserver" in window) {
                new IntersectionObserver((entries) => {
                    for (const entry of entries) {
                        entry.isIntersecting ? sketch.loop() : sketch.noLoop();
                    }
                }, { threshold: 0 }).observe(stage);
            }
        }

        /** Reads configuration off the stage element and kicks the sketch off. */
        function start() {
            const stage = document.getElementById(STAGE_ID);
            if (!stage) return;

            const style = getComputedStyle(stage);
            const config = {
                precessPeriod: readNumber(style, "--ring-precess-period", 9),
                nodPeriod: readNumber(style, "--ring-nod-period", 14),
                lean: readNumber(style, "--ring-lean", 45),
                nod: readNumber(style, "--ring-nod", 20),
                gold: readColor(style, "--ring-gold", [198, 154, 62]),
                goldLit: readColor(style, "--ring-gold-lit", [255, 226, 150]),
                reducedMotion: window.matchMedia("(prefers-reduced-motion: reduce)").matches,
            };

            run(stage, config).catch(() => {
                // Leave the fallback text in place; nothing else to do.
            });
        }

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", start, { once: true });
        } else {
            start();
        }
    })();
</script>
